<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — International Learning Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="Profile">
<div id="nav"></div>

<section style="padding:48px 0;">
  <div class="container">
    <div id="dashHead"></div>
    <div class="dash-row" style="margin-top:2rem;">
      <div class="card">
        <h3 id="reqTitle">Your trial requests</h3>
        <div id="reqList"><p style="color:var(--ink-2);">Loading...</p></div>
      </div>
      <div class="card" id="sideCard"></div>
    </div>
  </div>
</section>

<div id="footer"></div>
<script src="app.js"></script>
<script>
  const user = currentUser();
  if (!user){ location.href = 'login.html?next=dashboard.html'; }

  document.getElementById('dashHead').innerHTML = `
    <div style="display:flex;align-items:center;gap:16px;">
      <div class="avatar avatar-lg">${initials(user.firstName+' '+user.lastName)}</div>
      <div>
        <h2 style="margin-bottom:.1em;">Welcome, ${user.firstName}</h2>
        <p style="margin:0;color:var(--ink-2);">${user.role==='TUTOR' ? 'Tutor account' : 'Student account'} · ${user.email}</p>
      </div>
    </div>`;

  const reqList = document.getElementById('reqList');
  const isTutor = user.role === 'TUTOR';

  function statusBadge(s){ return `<span class="badge-status ${(s||'').toLowerCase()}">${s}</span>`; }

  if (isTutor){
    document.getElementById('reqTitle').textContent = 'Trial requests from students';
    document.getElementById('sideCard').innerHTML = `
      <h3>Your teaching subjects</h3>
      <p style="color:var(--ink-2);font-size:.88rem;">Manage your public profile from the profile page.</p>
      <a href="tutors.html" class="btn ghost small block">View tutor listing</a>`;
  } else {
    document.getElementById('sideCard').innerHTML = `
      <h3>Find your next tutor</h3>
      <p style="color:var(--ink-2);font-size:.88rem;">Browse tutors by subject, language and price.</p>
      <a href="tutors.html" class="btn primary small block">Browse tutors</a>`;
  }

  async function loadRequests(){
    try{
      const data = await fetchMyTrialRequests();
      const requests = data.requests || [];
      if (!requests.length){
        reqList.innerHTML = isTutor
          ? '<p style="color:var(--ink-2);">No requests yet.</p>'
          : '<p style="color:var(--ink-2);">You haven\'t booked a trial yet.</p>';
        return;
      }
      reqList.innerHTML = requests.map(r=>{
        const otherName = isTutor
          ? (r.student.firstName + ' ' + r.student.lastName)
          : (r.tutor.firstName + ' ' + r.tutor.lastName);
        const actions = (isTutor && r.status === 'PENDING')
          ? `<div style="display:flex;gap:8px;margin-top:6px;">
               <button class="btn primary small" onclick="respond('${r.id}','ACCEPTED')">Accept</button>
               <button class="btn ghost small" onclick="respond('${r.id}','DECLINED')">Decline</button>
             </div>`
          : '';
        return `
        <div class="req-item">
          <div>
            <strong>${otherName}</strong><br>
            <span style="font-size:.82rem;color:var(--ink-2);">Preferred: ${r.preferredTime||'—'}</span>
            ${actions}
          </div>
          ${statusBadge(r.status)}
        </div>`;
      }).join('');
    }catch(err){
      reqList.innerHTML = `<p style="color:var(--rose);">Could not load requests: ${err.message}</p>`;
    }
  }

  async function respond(id, status){
    try{
      await updateTrialRequestStatus(id, status);
      loadRequests();
    }catch(err){
      alert(err.message);
    }
  }
  window.respond = respond;

  loadRequests();
</script>
</body>
</html>
