<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — International Learning Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="Profile">
<div id="nav"></div>

<section style="padding:40px 0;">
  <div class="container">
    <div class="profile-layout">
      <aside class="profile-sidebar">
        <a href="dashboard.html" class="side-link active">Dashboard</a>
        <a href="profile.html" class="side-link">Profile</a>
        <a href="requests.html" class="side-link">Requests</a>
        <a href="#" class="side-link" onclick="logout();return false;">Log out</a>
      </aside>

      <div style="flex:1;min-width:0;">
        <div id="dashHead"></div>
        <div class="card" style="margin-top:1.5rem;">
          <h3 id="reqTitle">Your trial requests</h3>
          <div id="reqList"><p style="color:var(--ink-2);">Loading...</p></div>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="footer"></div>
<script src="app.js"></script>
<script>
  const user = currentUser();
  if (!user){ location.href = 'login.html?next=dashboard.html'; }

  document.getElementById('dashHead').innerHTML = `
    <div style="display:flex;align-items:center;gap:16px;">
      <div class="avatar avatar-lg">${initials(user.firstName+' '+user.lastName)}</div>
      <div>
        <h2 style="margin-bottom:.1em;">Welcome, ${user.firstName}</h2>
        <p style="margin:0;color:var(--ink-2);">${user.role==='TUTOR' ? 'Tutor account' : 'Student account'} · ${user.email}</p>
      </div>
    </div>`;

  const reqList = document.getElementById('reqList');
  const isTutor = user.role === 'TUTOR';

  function statusBadge(s){ return `<span class="badge-status ${(s||'').toLowerCase()}">${s}</span>`; }

  document.getElementById('reqTitle').textContent = isTutor ? 'Trial requests from students' : 'Your trial requests';

  async function loadRequests(){
    try{
      const data = await fetchMyTrialRequests();
      const requests = data.requests || [];
      if (!requests.length){
        reqList.innerHTML = isTutor
          ? '<p style="color:var(--ink-2);">No requests yet.</p>'
          : '<p style="color:var(--ink-2);">You haven\'t booked a trial yet.</p>';
        return;
      }
      reqList.innerHTML = requests.map(r=>{
        const otherName = isTutor
          ? (r.student.firstName + ' ' + r.student.lastName)
          : (r.tutor.firstName + ' ' + r.tutor.lastName);
        const actions = (isTutor && r.status === 'PENDING')
          ? `<div style="display:flex;gap:8px;margin-top:6px;">
               <button class="btn primary small" onclick="respond('${r.id}','ACCEPTED')">Accept</button>
               <button class="btn ghost small" onclick="respond('${r.id}','DECLINED')">Decline</button>
             </div>`
          : '';
        return `
        <div class="req-item">
          <div>
            <strong>${otherName}</strong><br>
            <span style="font-size:.82rem;color:var(--ink-2);">Preferred: ${r.preferredTime||'—'}</span>
            ${actions}
          </div>
          ${statusBadge(r.status)}
        </div>`;
      }).join('');
    }catch(err){
      reqList.innerHTML = `<p style="color:var(--rose);">Could not load requests: ${err.message}</p>`;
    }
  }

  async function respond(id, status){
    try{
      await updateTrialRequestStatus(id, status);
      loadRequests();
    }catch(err){
      alert(err.message);
    }
  }
  window.respond = respond;

  loadRequests();
</script>
<style>
  .profile-layout{ display:flex; gap:24px; align-items:flex-start; }
  .profile-sidebar{
    width:180px; flex-shrink:0; display:flex; flex-direction:column; gap:8px;
    border:1px solid var(--line,#eee); border-radius:10px; padding:12px; background:#fff;
  }
  .side-link{
    padding:10px 12px; border-radius:8px; text-decoration:none; color:var(--ink-2,#555);
    font-weight:500; font-size:.92rem;
  }
  .side-link:hover{ background:#f4f4f4; }
  .side-link.active{ background:var(--green,#1e7d43); color:#fff; }

  @media (max-width:720px){
    .profile-layout{ flex-direction:column; }
    .profile-sidebar{ width:100%; flex-direction:row; }
  }
</style>
</body>
</html>
