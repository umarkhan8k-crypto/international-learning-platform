<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trial Requests — International Learning Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="">
<div id="nav"></div>

<section style="padding:40px 0;">
  <div class="container">
    <div id="reqWrap"><p style="color:var(--ink-2);">Loading your requests...</p></div>
  </div>
</section>

<div id="footer"></div>
<script src="app.js"></script>
<script src="authgate.js"></script>
<script>
requireAuthAndProfile().then(() => {

  const user = currentUser();
  const isTutor = user.role === 'TUTOR';

  function fmtDate(iso){
    try{ return new Date(iso).toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
    catch(e){ return iso; }
  }

  function statusBadge(status){
    const map = { PENDING:'#b8860b', ACCEPTED:'#1e7d43', DECLINED:'#c0392b', COMPLETED:'#2e5aa8' };
    return `<span style="color:${map[status]||'#888'};font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;">${status}</span>`;
  }

  function requestCard(r){
    const other = isTutor ? r.student : r.tutor;
    const otherName = other.firstName + ' ' + other.lastName;

    const iAmReceiver = r.initiatedBy === 'TUTOR' ? !isTutor : isTutor;
    const iSentIt = !iAmReceiver;

    let actions = '';
    if (r.status === 'PENDING' && iAmReceiver){
      actions = `
        <div style="margin-top:10px;">
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn primary small" data-accept-toggle="${r.id}">Accept</button>
            <button class="btn ghost small" data-decline="${r.id}">Decline</button>
          </div>
          <div id="acceptForm-${r.id}" style="display:none;margin-top:10px;">
            <label style="font-size:.8rem;color:var(--ink-2);display:block;margin-bottom:4px;">Class date &amp; time</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
              <input type="datetime-local" id="acceptTime-${r.id}" style="padding:8px;border:1px solid var(--line,#ccc);border-radius:6px;">
              <button class="btn primary small" data-confirm-accept="${r.id}">Confirm</button>
            </div>
          </div>
        </div>`;
    } else if (r.status === 'PENDING' && iSentIt){
      actions = `<p style="color:var(--ink-2);font-size:.85rem;margin-top:8px;">Waiting for ${otherName.split(' ')[0]} to respond.</p>`;
    } else if (r.status === 'ACCEPTED' && r.scheduledAt){
      actions = `<p style="color:var(--ink-2);font-size:.85rem;margin-top:8px;">Scheduled for <strong>${fmtDate(r.scheduledAt)}</strong> — it will be marked completed automatically once that time passes.</p>`;
    }

    return `
      <div class="request-card" data-id="${r.id}" style="border:1px solid var(--line,#eee);border-radius:10px;padding:16px;margin-bottom:14px;background:#fff;">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
          <div>
            <strong>${otherName}</strong>
            <div style="color:var(--ink-2);font-size:.85rem;">${r.initiatedBy === 'TUTOR' ? 'Message: ' + r.preferredTime : 'Preferred: ' + r.preferredTime}</div>
          </div>
          ${statusBadge(r.status)}
        </div>
        ${actions}
        <a href="messages.html?open=${other.id}" class="btn ghost small" style="margin-top:10px;display:inline-block;">Message ${otherName.split(' ')[0]}</a>
      </div>`;
  }

  function groupRequests(requests){
    const groups = { ACCEPTED: [], PENDING: [], COMPLETED: [], DECLINED: [] };
    requests.forEach(r => { if (groups[r.status]) groups[r.status].push(r); });
    return groups;
  }

  function sectionHtml(title, color, list){
    if (!list.length) return '';
    return `
      <div style="margin-bottom:28px;">
        <h3 style="color:${color};margin:0 0 12px 0;font-size:1.05rem;">${title}</h3>
        ${list.map(requestCard).join('')}
      </div>`;
  }

  function renderGroupedRequests(requests){
    if (!requests.length) return '<p style="color:var(--ink-2);">No requests yet.</p>';
    const groups = groupRequests(requests);
    return [
      sectionHtml('Accepted Requests', '#1e7d43', groups.ACCEPTED),
      sectionHtml('Pending Requests', '#b8860b', groups.PENDING),
      sectionHtml('Completed', '#2e5aa8', groups.COMPLETED),
      sectionHtml('Declined', '#c0392b', groups.DECLINED),
    ].join('');
  }

  async function load(){
    const wrap = document.getElementById('reqWrap');
    try{
      const { requests } = await fetchMyTrialRequests();

      wrap.innerHTML = `
        <div class="profile-layout">
          ${sidebarHtml('requests')}
          <div class="profile-card" style="flex:1;">
            <h2 style="margin-top:0;">Your trial requests</h2>
            ${renderGroupedRequests(requests)}
          </div>
        </div>`;
      initSidebarWidgets();

      wrap.querySelectorAll('[data-accept-toggle]').forEach(btn => {
        btn.addEventListener('click', () => {
          const form = document.getElementById('acceptForm-' + btn.dataset.acceptToggle);
          if (form) form.style.display = form.style.display === 'none' ? 'block' : 'none';
        });
      });

      wrap.querySelectorAll('[data-confirm-accept]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.confirmAccept;
          const input = document.getElementById('acceptTime-' + id);
          const value = input ? input.value : '';
          if (!value){ alert('Please choose the class date & time.'); return; }
          const scheduledAt = new Date(value).toISOString();
          btn.disabled = true;
          playAcceptSound();
          try{ await updateTrialRequestStatus(id, 'ACCEPTED', scheduledAt); load(); }
          catch(err){ alert(err.message); btn.disabled = false; }
        });
      });

      wrap.querySelectorAll('[data-decline]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          playDeclineSound();
          try{ await updateTrialRequestStatus(btn.dataset.decline, 'DECLINED'); load(); }
          catch(err){ alert(err.message); btn.disabled = false; }
        });
      });
    }catch(err){
      wrap.innerHTML = `<p style="color:var(--rose,#c0392b);">Could not load your requests: ${err.message}</p>`;
    }
  }

  load();

});
</script>
<style>
  .profile-layout{ display:flex; gap:24px; align-items:flex-start; }
  .profile-sidebar{
    width:180px; flex-shrink:0; display:flex; flex-direction:column; gap:8px;
    border:1px solid var(--line,#eee); border-radius:10px; padding:12px; background:#fff;
  }
  .side-link{ padding:10px 12px; border-radius:8px; text-decoration:none; color:var(--ink-2,#555); font-weight:500; font-size:.92rem; }
  .side-link:hover{ background:#f4f4f4; }
  .side-link.active{ background:var(--green,#1e7d43); color:#fff; }
  .profile-card{ border:1px solid var(--line,#eee); border-radius:12px; padding:24px; background:#fff; }
  @media (max-width:720px){ .profile-layout{ flex-direction:column; } .profile-sidebar{ width:100%; flex-direction:row; } }
</style>
</body>
</html>
