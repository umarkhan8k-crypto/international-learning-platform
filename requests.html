<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trial Requests — International Learning Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="">
<div id="nav"></div>

<section style="padding:40px 0;">
  <div class="container">
    <div id="reqWrap"><p style="color:var(--ink-2);">Loading your requests...</p></div>
  </div>
</section>

<div id="footer"></div>
<script src="app.js"></script>
<script>
  const user = currentUser();
  if (!user){ location.href = 'login.html?next=requests.html'; }
  const isTutor = user.role === 'TUTOR';

  function fmtDate(iso){
    try{ return new Date(iso).toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
    catch(e){ return iso; }
  }

  function statusBadge(status){
    const map = { PENDING:'#b8860b', ACCEPTED:'#1e7d43', DECLINED:'#c0392b', COMPLETED:'#2e5aa8' };
    return `<span style="color:${map[status]||'#888'};font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;">${status}</span>`;
  }

  async function loadThread(requestId, threadEl){
    threadEl.innerHTML = '<p style="color:var(--ink-2);font-size:.85rem;">Loading messages...</p>';
    try{
      const { messages } = await apiRequest('/messages/thread/' + requestId);
      renderThread(requestId, threadEl, messages);
    }catch(err){
      threadEl.innerHTML = `<p style="color:var(--rose,#c0392b);font-size:.85rem;">${err.message}</p>`;
    }
  }

  function renderThread(requestId, threadEl, messages){
    const msgsHtml = messages.length
      ? messages.map(m => {
          const mine = m.senderId === user.id;
          return `<div style="display:flex;justify-content:${mine?'flex-end':'flex-start'};margin-bottom:6px;">
            <div style="max-width:75%;padding:8px 12px;border-radius:12px;background:${mine?'var(--green,#1e7d43)':'#f0f0f0'};color:${mine?'#fff':'#222'};font-size:.88rem;">
              ${m.content}
            </div>
          </div>`;
        }).join('')
      : '<p style="color:var(--ink-2);font-size:.85rem;">No messages yet — say hello.</p>';

    threadEl.innerHTML = `
      <div class="chat-scroll" style="max-height:240px;overflow-y:auto;padding:10px;border:1px solid var(--line,#eee);border-radius:8px;margin-bottom:10px;">
        ${msgsHtml}
      </div>
      <form class="chat-form" style="display:flex;gap:8px;">
        <input type="text" placeholder="Write a message..." required style="flex:1;padding:8px 12px;border:1px solid var(--line,#ccc);border-radius:8px;">
        <button type="submit" class="btn primary small">Send</button>
      </form>`;

    threadEl.querySelector('.chat-scroll').scrollTop = threadEl.querySelector('.chat-scroll').scrollHeight;

    threadEl.querySelector('.chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = e.target.querySelector('input');
      const content = input.value.trim();
      if (!content) return;
      input.disabled = true;
      try{
        await apiRequest('/messages/thread/' + requestId, { method:'POST', body: JSON.stringify({ content }) });
        input.value = '';
        playMessageSound();
        await loadThread(requestId, threadEl);
      }catch(err){
        alert(err.message);
      }finally{
        input.disabled = false;
      }
    });
  }

  function requestCard(r){
    const otherName = isTutor
      ? r.student.firstName + ' ' + r.student.lastName
      : r.tutor.firstName + ' ' + r.tutor.lastName;

    // The receiver (whoever did NOT send the request) gets Accept/Decline.
    // The tutor alone can mark an accepted lesson as completed.
    const iAmReceiver = r.initiatedBy === 'TUTOR' ? !isTutor : isTutor;
    const iSentIt = !iAmReceiver;

    let actions = '';
    if (r.status === 'PENDING' && iAmReceiver){
      actions = `<div style="display:flex;gap:8px;margin-top:10px;">
           <button class="btn primary small" data-accept="${r.id}">Accept</button>
           <button class="btn ghost small" data-decline="${r.id}">Decline</button>
         </div>`;
    } else if (r.status === 'PENDING' && iSentIt){
      actions = `<p style="color:var(--ink-2);font-size:.85rem;margin-top:8px;">Waiting for ${otherName.split(' ')[0]} to respond.</p>`;
    } else if (isTutor && r.status === 'ACCEPTED'){
      actions = `<div style="margin-top:10px;">
           <button class="btn primary small" data-complete="${r.id}">Mark class as completed</button>
         </div>`;
    }

    return `
      <div class="request-card" data-id="${r.id}" style="border:1px solid var(--line,#eee);border-radius:10px;padding:16px;margin-bottom:14px;background:#fff;">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
          <div>
            <strong>${otherName}</strong>
            <div style="color:var(--ink-2);font-size:.85rem;">${r.initiatedBy === 'TUTOR' ? 'Message: ' + r.preferredTime : 'Preferred: ' + r.preferredTime}</div>
          </div>
          ${statusBadge(r.status)}
        </div>
        ${actions}
        <button class="btn ghost small toggle-chat" data-id="${r.id}" style="margin-top:10px;">Message ${otherName.split(' ')[0]}</button>
        <div class="thread" data-thread="${r.id}" style="display:none;margin-top:12px;"></div>
      </div>`;
  }

  async function load(){
    const wrap = document.getElementById('reqWrap');
    try{
      const { requests } = await fetchMyTrialRequests();

      wrap.innerHTML = `
        <div class="profile-layout">
          ${sidebarHtml('requests')}
          <div class="profile-card" style="flex:1;">
            <h2 style="margin-top:0;">Your trial requests</h2>
            ${requests.length ? requests.map(requestCard).join('') : '<p style="color:var(--ink-2);">No requests yet.</p>'}
          </div>
        </div>`;
      initSidebarWidgets();

      wrap.querySelectorAll('.toggle-chat').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const threadEl = wrap.querySelector(`.thread[data-thread="${id}"]`);
          const opening = threadEl.style.display === 'none';
          threadEl.style.display = opening ? 'block' : 'none';
          btn.textContent = opening ? 'Hide messages' : btn.textContent.replace('Hide messages','Message');
          if (opening && !threadEl.dataset.loaded){
            threadEl.dataset.loaded = '1';
            loadThread(id, threadEl);
          }
        });
      });

      wrap.querySelectorAll('[data-accept]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          try{ await updateTrialRequestStatus(btn.dataset.accept, 'ACCEPTED'); playAcceptSound(); load(); }
          catch(err){ alert(err.message); btn.disabled = false; }
        });
      });
      wrap.querySelectorAll('[data-decline]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          try{ await updateTrialRequestStatus(btn.dataset.decline, 'DECLINED'); playDeclineSound(); load(); }
          catch(err){ alert(err.message); btn.disabled = false; }
        });
      });
      wrap.querySelectorAll('[data-complete]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Mark this class as completed? This will add +1 to your total classes taught.')) return;
          btn.disabled = true;
          try{ await updateTrialRequestStatus(btn.dataset.complete, 'COMPLETED'); playAcceptSound(); load(); }
          catch(err){ alert(err.message); btn.disabled = false; }
        });
      });
    }catch(err){
      wrap.innerHTML = `<p style="color:var(--rose,#c0392b);">Could not load your requests: ${err.message}</p>`;
    }
  }

  load();
</script>
<style>
  .profile-layout{ display:flex; gap:24px; align-items:flex-start; }
  .profile-sidebar{
    width:180px; flex-shrink:0; display:flex; flex-direction:column; gap:8px;
    border:1px solid var(--line,#eee); border-radius:10px; padding:12px; background:#fff;
  }
  .side-link{ padding:10px 12px; border-radius:8px; text-decoration:none; color:var(--ink-2,#555); font-weight:500; font-size:.92rem; }
  .side-link:hover{ background:#f4f4f4; }
  .side-link.active{ background:var(--green,#1e7d43); color:#fff; }
  .profile-card{ border:1px solid var(--line,#eee); border-radius:12px; padding:24px; background:#fff; }
  @media (max-width:720px){ .profile-layout{ flex-direction:column; } .profile-sidebar{ width:100%; flex-direction:row; } }
</style>
</body>
</html>
