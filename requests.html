<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trial Requests — International Learning Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="">
<div id="nav"></div>

<section style="padding:40px 0;">
  <div class="container">
    <div id="reqWrap"><p style="color:var(--ink-2);">Loading your requests...</p></div>
  </div>
</section>

<div id="footer"></div>
<script src="app.js"></script>
<script>
  const user = currentUser();
  if (!user){ location.href = 'login.html?next=requests.html'; }
  const isTutor = user.role === 'TUTOR';

  const editingLinkIds = new Set();
  let lastRequests = [];

  function statusBadge(status){
    const map = { PENDING:'#b8860b', ACCEPTED:'#1e7d43', DECLINED:'#c0392b', COMPLETED:'#2e5aa8' };
    return `<span style="color:${map[status]||'#888'};font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;">${status}</span>`;
  }

  function otherIdOf(r){
    return isTutor ? r.student.id : r.tutor.id;
  }

  function otherNameOf(r){
    return isTutor
      ? r.student.firstName + ' ' + r.student.lastName
      : r.tutor.firstName + ' ' + r.tutor.lastName;
  }

  function detailOf(r){
    return r.initiatedBy === 'TUTOR' ? 'Message: ' + r.preferredTime : 'Preferred: ' + r.preferredTime;
  }

  function fmtDateTime(iso){
    try{ return new Date(iso).toLocaleString(undefined, { weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
    catch(e){ return iso; }
  }

  // NEW: takes you straight to this person's thread on messages.html
  // (messages.html reads the "open" query param to scroll to/open a thread)
  function messageButtonHtml(r){
    return `<a href="messages.html?open=${otherIdOf(r)}" class="btn ghost small message-btn">💬 Message</a>`;
  }

  function quickLaunchChips(){
    return `
      <div class="quick-launch-inline">
        <a href="https://zoom.us/start" target="_blank" rel="noopener" class="ql-chip ql-zoom">🎥 Zoom</a>
        <a href="https://meet.google.com/new" target="_blank" rel="noopener" class="ql-chip ql-meet">📅 Meet</a>
        <a href="https://teams.microsoft.com/start" target="_blank" rel="noopener" class="ql-chip ql-teams">👥 Teams</a>
        <a href="https://web.skype.com/" target="_blank" rel="noopener" class="ql-chip ql-skype">☎️ Skype</a>
        <a href="https://web.whatsapp.com/" target="_blank" rel="noopener" class="ql-chip ql-whatsapp">💬 WhatsApp</a>
      </div>`;
  }

  function meetingLinkBlock(r){
    const editing = editingLinkIds.has(r.id);

    if (r.meetingLink && !editing){
      return `
        <div class="meeting-block">
          <a href="${r.meetingLink}" target="_blank" rel="noopener" class="btn primary small join-class-btn">🎬 Join Class</a>
          ${isTutor ? `<button type="button" class="btn ghost small" data-edit-link="${r.id}">Change link</button>` : ''}
        </div>`;
    }

    if (!isTutor){
      return `<p class="req-detail" style="margin-top:8px;">Waiting for your tutor to add the class link.</p>`;
    }

    return `
      <div class="meeting-setup">
        ${quickLaunchChips()}
        <form class="link-form" data-save-link="${r.id}">
          <input type="url" placeholder="Paste the class link here..." required value="${r.meetingLink || ''}">
          <button type="submit" class="btn primary small">Save link</button>
          ${editing ? `<button type="button" class="btn ghost small" data-cancel-edit="${r.id}">Cancel</button>` : ''}
        </form>
      </div>`;
  }

  function acceptedCard(r){
    return `
      <div class="request-card" data-id="${r.id}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;">
          <strong>${otherNameOf(r)}</strong>
          ${messageButtonHtml(r)}
        </div>
        <div class="req-detail">${detailOf(r)}</div>
        ${r.scheduledAt ? `<div class="req-detail">🗓️ Class time: ${fmtDateTime(r.scheduledAt)}</div>` : ''}
        ${meetingLinkBlock(r)}
      </div>`;
  }

  function pendingCard(r){
    const otherName = otherNameOf(r);
    const iAmReceiver = r.initiatedBy === 'TUTOR' ? !isTutor : isTutor;
    const actions = iAmReceiver
      ? `<form class="accept-form" data-accept-form="${r.id}">
           <input type="datetime-local" required>
           <button type="submit" class="btn primary small">Accept</button>
         </form>
         <button type="button" class="btn ghost small" data-decline="${r.id}" style="margin-top:8px;">Decline</button>`
      : `<p class="req-detail" style="margin-top:8px;">Waiting for ${otherName.split(' ')[0]} to respond.</p>`;

    return `
      <div class="request-card" data-id="${r.id}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;">
          <strong>${otherName}</strong>
          ${messageButtonHtml(r)}
        </div>
        <div class="req-detail">${detailOf(r)}</div>
        ${actions}
      </div>`;
  }

  function pastCard(r){
    return `
      <div class="request-card" data-id="${r.id}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
          <strong>${otherNameOf(r)}</strong>
          ${statusBadge(r.status)}
        </div>
        <div class="req-detail">${detailOf(r)}</div>
        ${r.status === 'COMPLETED' && r.meetingLink ? `<div class="req-detail">Link used: <a href="${r.meetingLink}" target="_blank" rel="noopener">${r.meetingLink}</a></div>` : ''}
        <div style="margin-top:8px;">${messageButtonHtml(r)}</div>
      </div>`;
  }

  function sidebar(active){
    const findLink = isTutor
      ? `<a href="students.html" class="side-link ${active==='find'?'active':''}">Find Students</a>`
      : `<a href="tutors.html" class="side-link ${active==='find'?'active':''}">Find a Tutor</a>`;
    return `
      <a href="dashboard.html" class="side-link">Dashboard</a>
      <a href="profile.html" class="side-link">Profile</a>
      ${findLink}
      <a href="requests.html" class="side-link ${active==='requests'?'active':''}" style="display:flex;align-items:center;justify-content:space-between;">
        <span>Requests</span>
        <span id="requestsBadge" style="display:none;background:#c0392b;color:#fff;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 7px;min-width:18px;text-align:center;"></span>
      </a>
      <a href="messages.html" class="side-link ${active==='messages'?'active':''}" style="display:flex;align-items:center;justify-content:space-between;">
        <span>Messages</span>
        <span id="messagesBadge" style="display:none;background:#c0392b;color:#fff;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 7px;min-width:18px;text-align:center;"></span>
      </a>
      <a href="payments.html" class="side-link">Payments</a>
      <button class="side-link" id="notifBtn" style="border:none;background:none;text-align:left;cursor:pointer;width:100%;font:inherit;color:var(--ink-2,#555);display:flex;align-items:center;gap:6px;" onclick="handleEnableNotifications(this)"><span id="notifBell">🔴</span><span id="notifLabel" style="color:#c0392b;font-weight:600;">Notifications off</span></button>
      <a href="#" class="side-link" onclick="logout();return false;">Log out</a>`;
  }

  async function refreshNotifButtonState(){
    const bell = document.getElementById('notifBell');
    const label = document.getElementById('notifLabel');
    if (!bell || !label) return;
    try{
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      const registration = await navigator.serviceWorker.getRegistration();
      const subscription = registration ? await registration.pushManager.getSubscription() : null;
      if (subscription && Notification.permission === 'granted'){
        bell.textContent = '🟢';
        label.textContent = 'Notifications on';
        label.style.color = '#1e7d43';
      }
    }catch(err){ /* ignore — button just stays in its default (off) state */ }
  }

  async function handleEnableNotifications(btn){
    btn.disabled = true;
    const bell = document.getElementById('notifBell');
    const label = document.getElementById('notifLabel');
    try{
      await enablePushNotifications();
      if (bell) bell.textContent = '🟢';
      if (label){ label.textContent = 'Notifications on'; label.style.color = '#1e7d43'; }
    }catch(err){
      alert(err.message);
      btn.disabled = false;
    }
  }

  function refreshRequestsBadge(requests){
    const badge = document.getElementById('requestsBadge');
    if (!badge) return;
    const pendingForMe = requests.filter(r => {
      const iAmReceiver = r.initiatedBy === 'TUTOR' ? !isTutor : isTutor;
      return r.status === 'PENDING' && iAmReceiver;
    }).length;
    if (pendingForMe > 0){
      badge.textContent = pendingForMe;
      badge.style.display = 'inline-block';
    }
  }

  async function refreshMessagesBadge(){
    const badge = document.getElementById('messagesBadge');
    if (!badge) return;
    try{
      const count = await getUnreadMessageCount();
      if (count > 0){
        badge.textContent = count;
        badge.style.display = 'inline-block';
      }
    }catch(err){ /* ignore — badge just stays hidden */ }
  }

  function renderAll(){
    const wrap = document.getElementById('reqWrap');
    const accepted = lastRequests.filter(r => r.status === 'ACCEPTED');
    const pending  = lastRequests.filter(r => r.status === 'PENDING');
    const past     = lastRequests.filter(r => r.status === 'COMPLETED' || r.status === 'DECLINED');

    wrap.innerHTML = `
      <div class="profile-layout">
        <aside class="profile-sidebar">
          ${sidebar('requests')}
        </aside>
        <div class="profile-card" style="flex:1;">

          <h2 class="section-heading accepted-heading">Accepted Requests</h2>
          <div class="request-list">
            ${accepted.length ? accepted.map(acceptedCard).join('') : '<p style="color:var(--ink-2);">No accepted requests yet.</p>'}
          </div>

          <h2 class="section-heading pending-heading">Pending Requests</h2>
          <div class="request-list">
            ${pending.length ? pending.map(pendingCard).join('') : '<p style="color:var(--ink-2);">No pending requests.</p>'}
          </div>

          ${past.length ? `
          <h2 class="section-heading past-heading">Past Requests</h2>
          <div class="request-list">
            ${past.map(pastCard).join('')}
          </div>` : ''}

        </div>
      </div>`;

    refreshNotifButtonState();
    refreshRequestsBadge(lastRequests);
    refreshMessagesBadge();
    wireActions(wrap);
  }

  function wireActions(wrap){
    wrap.querySelectorAll('[data-accept-form]').forEach(form => {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = form.dataset.acceptForm;
        const input = form.querySelector('input[type="datetime-local"]');
        const btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        try{
          await updateTrialRequestStatus(id, 'ACCEPTED', new Date(input.value).toISOString());
          await load();
        }catch(err){ alert(err.message); btn.disabled = false; }
      });
    });

    wrap.querySelectorAll('[data-decline]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try{ await updateTrialRequestStatus(btn.dataset.decline, 'DECLINED'); await load(); }
        catch(err){ alert(err.message); btn.disabled = false; }
      });
    });

    wrap.querySelectorAll('[data-save-link]').forEach(form => {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = form.dataset.saveLink;
        const input = form.querySelector('input[type="url"]');
        const btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        try{
          await saveMeetingLink(id, input.value.trim());
          editingLinkIds.delete(id);
          await load();
        }catch(err){ alert(err.message); btn.disabled = false; }
      });
    });

    wrap.querySelectorAll('[data-edit-link]').forEach(btn => {
      btn.addEventListener('click', () => {
        editingLinkIds.add(btn.dataset.editLink);
        renderAll();
      });
    });

    wrap.querySelectorAll('[data-cancel-edit]').forEach(btn => {
      btn.addEventListener('click', () => {
        editingLinkIds.delete(btn.dataset.cancelEdit);
        renderAll();
      });
    });
  }

  async function load(){
    const wrap = document.getElementById('reqWrap');
    try{
      const { requests } = await fetchMyTrialRequests();
      lastRequests = requests;
      renderAll();
    }catch(err){
      wrap.innerHTML = `<p style="color:var(--rose,#c0392b);">Could not load your requests: ${err.message}</p>`;
    }
  }

  load();
</script>
<style>
  .profile-layout{ display:flex; gap:24px; align-items:flex-start; }
  .profile-sidebar{
    width:180px; flex-shrink:0; display:flex; flex-direction:column; gap:8px;
    border:1px solid var(--line,#eee); border-radius:10px; padding:12px; background:#fff;
  }
  .side-link{ padding:10px 12px; border-radius:8px; text-decoration:none; color:var(--ink-2,#555); font-weight:500; font-size:.92rem; }
  .side-link:hover{ background:#f4f4f4; }
  .side-link.active{ background:var(--green,#1e7d43); color:#fff; }
  .profile-card{ border:1px solid var(--line,#eee); border-radius:12px; padding:24px; background:#fff; }
  @media (max-width:720px){ .profile-layout{ flex-direction:column; } .profile-sidebar{ width:100%; flex-direction:row; flex-wrap:wrap; } }

  .section-heading{ margin:0 0 12px; font-size:1.1rem; font-weight:800; }
  .section-heading:not(:first-child){ margin-top:28px; }
  .accepted-heading{ color:#1e7d43; }
  .pending-heading{ color:#b8860b; }
  .past-heading{ color:var(--ink-2,#888); }

  .request-list{ display:flex; flex-direction:column; gap:14px; }
  .request-card{ border:1px solid var(--line,#eee); border-radius:10px; padding:16px; background:#fff; }
  .req-detail{ color:var(--ink-2); font-size:.85rem; margin-top:4px; }

  .message-btn{ flex-shrink:0; }

  .accept-form{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
  .accept-form input[type="datetime-local"]{ padding:8px 10px; border:1px solid var(--line,#ccc); border-radius:8px; font-size:.85rem; }

  .meeting-block{ display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .join-class-btn{ background:#1e7d43 !important; }

  .meeting-setup{ margin-top:10px; }
  .quick-launch-inline{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .ql-chip{
    display:inline-flex; align-items:center; gap:4px; padding:6px 10px; border-radius:999px;
    color:#fff; font-size:.78rem; font-weight:600; text-decoration:none;
  }
  .ql-zoom{ background:#2D8CFF; }
  .ql-meet{ background:#00897B; }
  .ql-teams{ background:#5059C9; }
  .ql-skype{ background:#00AFF0; }
  .ql-whatsapp{ background:#25D366; }

  .link-form{ display:flex; flex-wrap:wrap; gap:8px; }
  .link-form input[type="url"]{ flex:1; min-width:180px; padding:8px 12px; border:1px solid var(--line,#ccc); border-radius:8px; font-size:.85rem; }
</style>
</body>
</html>
