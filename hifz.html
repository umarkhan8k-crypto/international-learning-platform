<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hifz Progress — International Learning Platform</title>
<link rel="stylesheet" href="style.css">
<style>
  .juz-grid{ display:grid; grid-template-columns:repeat(10,1fr); gap:6px; margin:16px 0 24px; }
  .juz-cell{
    aspect-ratio:1; border-radius:6px; display:flex; align-items:center; justify-content:center;
    font-size:.78rem; font-weight:600; color:#fff; background:#e2e2e2; color:#999;
  }
  .juz-cell.memorized{ background:var(--green,#1e7d43); color:#fff; }
  .juz-cell.memorizing{ background:#e0a30c; color:#fff; }
  .juz-cell.revising{ background:#3b6fd6; color:#fff; }
  .entry-row{
    display:flex; align-items:center; justify-content:space-between; padding:12px 0;
    border-bottom:1px solid var(--line,#eee);
  }
  .status-pill{ font-size:.72rem; font-weight:700; padding:2px 10px; border-radius:999px; }
  .status-pill.MEMORIZED{ background:#e6f4ea; color:#1e7d43; }
  .status-pill.MEMORIZING{ background:#fdf1d6; color:#a1720c; }
  .status-pill.REVISING{ background:#e6edfb; color:#2952a3; }
  .legend{ display:flex; gap:16px; font-size:.8rem; color:var(--ink-2,#666); margin-bottom:8px; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; }
  .plain-select{
    width:100%;padding:10px;border:1px solid var(--line,#ccc);border-radius:8px;box-sizing:border-box;
    background:#fff;font-family:inherit;
  }
  .plain-select:disabled{ background:#f4f4f4; color:#999; }
</style>
</head>
<body data-page="Hifz Progress">
<div id="nav"></div>

<section class="page-hero">
  <div class="container">
    <div class="eyebrow" style="justify-content:center;">Progress</div>
    <h1 id="pageTitle">Hifz Progress</h1>
    <p style="color:var(--ink-2);" id="pageSub">Track memorization progress, juz by juz.</p>
  </div>
</section>

<section style="padding-top:30px;">
  <div class="container">

    <!-- Tutor only: pick a student, then add a new entry -->
    <div id="tutorControls" class="card" style="display:none; margin-bottom:1.5rem;">
      <h3>Add a progress entry</h3>
      <div class="field">
        <label>Student</label>
        <select id="studentSelect" style="width:100%;padding:10px;border:1px solid var(--line,#ccc);border-radius:8px;"></select>
      </div>
      <form id="entryForm" style="margin-top:14px;">

        <div class="field">
          <label>Para (Juz)</label>
          <select id="paraSelect" class="plain-select">
            <option value="">Select a Para</option>
          </select>
        </div>

        <div class="field">
          <label>Which quarter of this Para?</label>
          <select id="quarterInput" class="plain-select" disabled>
            <option value="">Select a Para first</option>
          </select>
        </div>

        <div class="field">
          <label>Surah</label>
          <select id="surahSelect" class="plain-select">
            <option value="">Select a surah</option>
          </select>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div class="field">
            <label>From ayah</label>
            <select id="fromAyah" class="plain-select" required disabled><option value="">Select a surah first</option></select>
          </div>
          <div class="field">
            <label>To ayah</label>
            <select id="toAyah" class="plain-select" required disabled><option value="">Select a surah first</option></select>
          </div>
          <div class="field">
            <label>Revision type (optional)</label>
            <select id="revisionType" class="plain-select">
              <option value="">Not specified</option>
              <option value="SABAQ">New lesson</option>
              <option value="SABQI">Recent revision</option>
              <option value="MANZIL">Old revision</option>
            </select>
          </div>
          <div class="field">
            <label>Status</label>
            <select id="statusInput" class="plain-select">
              <option value="MEMORIZING">Memorizing</option>
              <option value="MEMORIZED">Memorized</option>
              <option value="REVISING">Revising</option>
            </select>
          </div>
        </div>

        <div class="field" style="margin-top:10px;"><label>Notes (optional)</label><textarea id="notesInput" rows="2" style="width:100%;padding:10px;border:1px solid var(--line,#ccc);border-radius:8px;box-sizing:border-box;"></textarea></div>
        <div id="formMsg" class="msg" style="display:none;margin-top:10px;"></div>
        <button class="btn primary" type="submit" style="margin-top:12px;">Save entry</button>
      </form>
    </div>

    <div class="card">
      <div class="legend">
        <span><i style="background:var(--green,#1e7d43);"></i> Memorized</span>
        <span><i style="background:#e0a30c;"></i> Memorizing</span>
        <span><i style="background:#3b6fd6;"></i> Revising</span>
        <span><i style="background:#e2e2e2;"></i> Not started</span>
      </div>
      <div class="juz-grid" id="juzGrid"></div>

      <h3>Entries</h3>
      <div id="entryList"><p style="color:var(--ink-2);">Loading...</p></div>
    </div>

  </div>
</section>

<div id="footer"></div>
<script src="app.js"></script>
<script src="authgate.js"></script>
<script>
/* ---------- full list of the 114 surahs, with their ayah counts ---------- */
const SURAHS = [

  {number:4,name:'An-Nisa',ayahs:176},{number:5,name:"Al-Ma'idah",ayahs:120},{number:6,name:"Al-An'am",ayahs:165},
  {number:7,name:"Al-A'raf",ayahs:206},{number:8,name:'Al-Anfal',ayahs:75},{number:9,name:'At-Tawbah',ayahs:129},
  {number:10,name:'Yunus',ayahs:109},{number:11,name:'Hud',ayahs:123},{number:12,name:'Yusuf',ayahs:111},
  {number:13,name:"Ar-Ra'd",ayahs:43},{number:14,name:'Ibrahim',ayahs:52},{number:15,name:'Al-Hijr',ayahs:99},
  {number:16,name:'An-Nahl',ayahs:128},{number:17,name:'Al-Isra',ayahs:111},{number:18,name:'Al-Kahf',ayahs:110},
  {number:19,name:'Maryam',ayahs:98},{number:20,name:'Ta-Ha',ayahs:135},{number:21,name:'Al-Anbiya',ayahs:112},
  {number:22,name:'Al-Hajj',ayahs:78},{number:23,name:"Al-Mu'minun",ayahs:118},{number:24,name:'An-Nur',ayahs:64},
  {number:25,name:'Al-Furqan',ayahs:77},{number:26,name:"Ash-Shu'ara",ayahs:227},{number:27,name:'An-Naml',ayahs:93},
  {number:28,name:'Al-Qasas',ayahs:88},{number:29,name:'Al-Ankabut',ayahs:69},{number:30,name:'Ar-Rum',ayahs:60},
  {number:31,name:'Luqman',ayahs:34},{number:32,name:'As-Sajdah',ayahs:30},{number:33,name:'Al-Ahzab',ayahs:73},
  {number:34,name:'Saba',ayahs:54},{number:35,name:'Fatir',ayahs:45},{number:36,name:'Ya-Sin',ayahs:83},
  {number:37,name:'As-Saffat',ayahs:182},{number:38,name:'Sad',ayahs:88},{number:39,name:'Az-Zumar',ayahs:75},
  {number:40,name:'Ghafir',ayahs:85},{number:41,name:'Fussilat',ayahs:54},{number:42,name:'Ash-Shura',ayahs:53},
  {number:43,name:'Az-Zukhruf',ayahs:89},{number:44,name:'Ad-Dukhan',ayahs:59},{number:45,name:'Al-Jathiyah',ayahs:37},
  {number:46,name:'Al-Ahqaf',ayahs:35},{number:47,name:'Muhammad',ayahs:38},{number:48,name:'Al-Fath',ayahs:29},
  {number:49,name:'Al-Hujurat',ayahs:18},{number:50,name:'Qaf',ayahs:45},{number:51,name:'Adh-Dhariyat',ayahs:60},
  {number:52,name:'At-Tur',ayahs:49},{number:53,name:'An-Najm',ayahs:62},{number:54,name:'Al-Qamar',ayahs:55},
  {number:55,name:'Ar-Rahman',ayahs:78},{number:56,name:"Al-Waqi'ah",ayahs:96},{number:57,name:'Al-Hadid',ayahs:29},
  {number:58,name:'Al-Mujadila',ayahs:22},{number:59,name:'Al-Hashr',ayahs:24},{number:60,name:'Al-Mumtahanah',ayahs:13},
  {number:61,name:'As-Saff',ayahs:14},{number:62,name:"Al-Jumu'ah",ayahs:11},{number:63,name:'Al-Munafiqun',ayahs:11},
  {number:64,name:'At-Taghabun',ayahs:18},{number:65,name:'At-Talaq',ayahs:12},{number:66,name:'At-Tahrim',ayahs:12},
  {number:67,name:'Al-Mulk',ayahs:30},{number:68,name:'Al-Qalam',ayahs:52},{number:69,name:'Al-Haqqah',ayahs:52},

  {number:73,name:'Al-Muzzammil',ayahs:20},{number:74,name:'Al-Muddaththir',ayahs:56},{number:75,name:'Al-Qiyamah',ayahs:40},
  {number:76,name:'Al-Insan',ayahs:31},{number:77,name:'Al-Mursalat',ayahs:50},{number:78,name:'An-Naba',ayahs:40},
  {number:79,name:"An-Nazi'at",ayahs:46},{number:80,name:'Abasa',ayahs:42},{number:81,name:'At-Takwir',ayahs:29},
  {number:82,name:'Al-Infitar',ayahs:19},{number:83,name:'Al-Mutaffifin',ayahs:36},{number:84,name:'Al-Inshiqaq',ayahs:25},
  {number:85,name:'Al-Buruj',ayahs:22},{number:86,name:'At-Tariq',ayahs:17},{number:87,name:"Al-A'la",ayahs:19},
  {number:88,name:'Al-Ghashiyah',ayahs:26},{number:89,name:'Al-Fajr',ayahs:30},{number:90,name:'Al-Balad',ayahs:20},
  {number:91,name:'Ash-Shams',ayahs:15},{number:92,name:'Al-Layl',ayahs:21},{number:93,name:'Ad-Duha',ayahs:11},
  {number:94,name:'Ash-Sharh',ayahs:8},{number:95,name:'At-Tin',ayahs:8},{number:96,name:'Al-Alaq',ayahs:19},
  {number:97,name:'Al-Qadr',ayahs:5},{number:98,name:'Al-Bayyinah',ayahs:8},{number:99,name:'Az-Zalzalah',ayahs:8},
  {number:100,name:'Al-Adiyat',ayahs:11},{number:101,name:"Al-Qari'ah",ayahs:11},{number:102,name:'At-Takathur',ayahs:8},
  {number:103,name:'Al-Asr',ayahs:3},{number:104,name:'Al-Humazah',ayahs:9},{number:105,name:'Al-Fil',ayahs:5},
  {number:106,name:'Quraysh',ayahs:4},{number:107,name:"Al-Ma'un",ayahs:7},{number:108,name:'Al-Kawthar',ayahs:3},
  {number:109,name:'Al-Kafirun',ayahs:6},{number:110,name:'An-Nasr',ayahs:3},{number:111,name:'Al-Masad',ayahs:5},
  {number:112,name:'Al-Ikhlas',ayahs:4},{number:113,name:'Al-Falaq',ayahs:5},{number:114,name:'An-Nas',ayahs:6},
];

const JUZ_QUARTERS = ['Rubu', 'Nisf', 'Sulus', 'Last'];
const REVISION_LABELS = { SABAQ: 'New Lesson', SABQI: 'Recent Revision', MANZIL: 'Old Revision' };

/* ---------- traditional name of each Juz (Para), from its opening words ---------- */
const JUZ_NAMES = [
  'Alif Lam Meem','Sayaqoolu','Tilkal Rusul','Lan Tanaloo','Wal Muhsanat','La Yuhibbullah',
  'Wa Iza Samiu','Wa Lau Annana','Qalal Malao','Wa A lamu','Yataziroon','Wa Ma Min Dabbatin',
  'Wa Ma Ubarri u','Rubama','Subhanallazi','Qal Alam','Iqtaraba','Qad Aflaha',
  'Wa Qalallazina','A man Khalaq','Utlu Ma Oohiya','Wa Man Yaqnut','Wa Mali','Faman Azlam',
  'Ilayhi Yuraddu','Ha Meem','Qala Fama Khatbukum','Qad Sami Allah','Tabarakallazi','Amma',
];

requireAuthAndProfile().then(() => {
  const user = currentUser();
  const isTutor = user.role === 'TUTOR';
  let currentStudentId = isTutor ? null : user.id;
  let entriesCache = [];
  let selectedSurah = null;
  let selectedPara = null;

  if (isTutor) {
    document.getElementById('pageTitle').textContent = "Students' Hifz Progress";
    document.getElementById('tutorControls').style.display = 'block';
    initParaSelect();
    initSurahSelect();
    loadMyStudentsIntoSelect();
  }

  function initParaSelect(){
    const sel = document.getElementById('paraSelect');
    for (let j = 1; j <= 30; j++){
      const opt = document.createElement('option');
      opt.value = j;
      opt.textContent = `Para ${j} — ${JUZ_NAMES[j - 1]}`;
      sel.appendChild(opt);
    }
    sel.addEventListener('change', () => {
      selectedPara = sel.value ? Number(sel.value) : null;
      refreshQuarterSelect();
    });
  }

  function refreshQuarterSelect(){
    const sel = document.getElementById('quarterInput');
    if (!selectedPara){
      sel.innerHTML = '<option value="">Select a Para first</option>';
      sel.disabled = true;
      return;
    }
    sel.disabled = false;
    sel.innerHTML = '<option value="">Select a quarter</option>' +
      JUZ_QUARTERS.map(q => `<option value="${q}">${q}</option>`).join('');
  }

  function initSurahSelect(){
    const sel = document.getElementById('surahSelect');
    SURAHS.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.number;
      opt.textContent = `${s.number}. ${s.name} — ${s.ayahs} ayahs`;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', () => {
      selectedSurah = sel.value ? SURAHS.find(s => s.number === Number(sel.value)) : null;
      populateAyahSelects();
    });
  }

  function populateAyahSelects(){
    const fromSel = document.getElementById('fromAyah');
    const toSel = document.getElementById('toAyah');
    if (!selectedSurah){
      fromSel.innerHTML = '<option value="">Select a surah first</option>';
      toSel.innerHTML = '<option value="">Select a surah first</option>';
      fromSel.disabled = true;
      toSel.disabled = true;
      return;
    }
    const opts = Array.from({ length: selectedSurah.ayahs }, (_, i) => i + 1)
      .map(n => `<option value="${n}">${n}</option>`).join('');
    fromSel.innerHTML = opts;
    toSel.innerHTML = opts;
    fromSel.disabled = false;
    toSel.disabled = false;
    fromSel.value = 1;
    toSel.value = selectedSurah.ayahs;
  }

  async function loadMyStudentsIntoSelect(){
    try{
      const { requests } = await fetchMyTrialRequests();
      const accepted = requests.filter(r => r.status === 'ACCEPTED' || r.status === 'COMPLETED');
      const map = new Map();
      accepted.forEach(r => map.set(r.student.id, r.student));
      const select = document.getElementById('studentSelect');
      const students = Array.from(map.values());
      if (!students.length){
        select.innerHTML = '<option value="">No students yet</option>';
        return;
      }
      select.innerHTML = students.map(s => `<option value="${s.id}">${s.firstName} ${s.lastName}</option>`).join('');
      currentStudentId = select.value;
      select.addEventListener('change', () => { currentStudentId = select.value; loadEntries(); });
      loadEntries();
    }catch(err){
      document.getElementById('entryList').innerHTML = `<p style="color:var(--rose);">${err.message}</p>`;
    }
  }

  function juzStatus(juz){
    const rows = entriesCache.filter(e => e.juz === juz);
    if (!rows.length) return null;
    if (rows.some(r => r.status === 'MEMORIZED')) return 'memorized';
    if (rows.some(r => r.status === 'REVISING')) return 'revising';
    return 'memorizing';
  }

  function renderJuzGrid(){
    const grid = document.getElementById('juzGrid');
    grid.innerHTML = Array.from({length:30}, (_, i) => i+1).map(j => {
      const st = juzStatus(j);
      return `<div class="juz-cell ${st||''}" title="Juz ${j}">${j}</div>`;
    }).join('');
  }

  function renderEntries(){
    const el = document.getElementById('entryList');
    if (!entriesCache.length){
      el.innerHTML = '<p style="color:var(--ink-2);">No progress recorded yet.</p>';
      return;
    }
    el.innerHTML = entriesCache.map(e => `
      <div class="entry-row">
        <div>
          <strong>${e.surahName}</strong> (${e.fromAyah}–${e.toAyah})${e.juz ? ' · Juz ' + e.juz : ''}
          ${e.notes ? `<div style="font-size:.82rem;color:var(--ink-2);">${e.notes}</div>` : ''}
        </div>
        <span class="status-pill ${e.status}">${e.status}</span>
      </div>
    `).join('');
  }

  async function loadEntries(){
    if (!currentStudentId) return;
    document.getElementById('entryList').innerHTML = '<p style="color:var(--ink-2);">Loading...</p>';
    try{
      const data = isTutor
        ? await fetchStudentHifzProgress(currentStudentId)
        : await fetchMyHifzProgress();
      entriesCache = data || [];
      renderJuzGrid();
      renderEntries();
    }catch(err){
      document.getElementById('entryList').innerHTML = `<p style="color:var(--rose);">${err.message}</p>`;
    }
  }

  if (!isTutor) loadEntries();

  if (isTutor){
    document.getElementById('entryForm').addEventListener('submit', async e => {
      e.preventDefault();
      const msg = document.getElementById('formMsg');
      if (!currentStudentId){ return; }
      if (!selectedSurah){
        msg.className = 'msg error';
        msg.textContent = 'Please select a surah.';
        msg.style.display = 'block';
        return;
      }
      const fromAyah = Number(document.getElementById('fromAyah').value);
      const toAyah = Number(document.getElementById('toAyah').value);
      if (!fromAyah || !toAyah || toAyah < fromAyah){
        msg.className = 'msg error';
        msg.textContent = 'Please select a valid ayah range.';
        msg.style.display = 'block';
        return;
      }

      const quarterVal = document.getElementById('quarterInput').value || null;
      const revisionVal = document.getElementById('revisionType').value || null;
      const userNotes = document.getElementById('notesInput').value.trim();

      const notesParts = [];
      if (selectedPara && quarterVal) notesParts.push(`Para ${selectedPara} — ${quarterVal}`);
      else if (selectedPara) notesParts.push(`Para ${selectedPara}`);
      if (revisionVal) notesParts.push(REVISION_LABELS[revisionVal]);
      if (userNotes) notesParts.push(userNotes);

      const payload = {
        studentId: currentStudentId,
        surahName: selectedSurah.name,
        surahNumber: selectedSurah.number,
        fromAyah,
        toAyah,
        juz: selectedPara || null,
        status: document.getElementById('statusInput').value,
        notes: notesParts.length ? notesParts.join(' · ') : null,
      };
      try{
        await addHifzEntry(payload);
        msg.className = 'msg success';
        msg.textContent = 'Saved!';
        msg.style.display = 'block';
        document.getElementById('entryForm').reset();
        document.getElementById('surahSelect').value = '';
        document.getElementById('paraSelect').value = '';
        selectedSurah = null;
        selectedPara = null;
        populateAyahSelects();
        refreshQuarterSelect();
        loadEntries();
        setTimeout(() => { msg.style.display = 'none'; }, 2000);
      }catch(err){
        msg.className = 'msg error';
        msg.textContent = err.message;
        msg.style.display = 'block';
      }
    });
  }
});
</script>
</body>
</html>
