<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Class — International Learning Platform</title>
<link rel="stylesheet" href="style.css">
<script src="https://8x8.vc/external_api.js"></script>
<style>
  body{ margin:0; background:#111; }
  #topbar{
    background:#1F5C54; color:#fff; padding:10px 16px; display:flex;
    align-items:center; justify-content:space-between; font-family:inherit; gap:10px; flex-wrap:wrap;
  }
  #topbar a{ color:#fff; text-decoration:none; font-size:.85rem; opacity:.9; }
  #watchNote{
    font-size:.72rem; opacity:.85; background:rgba(255,255,255,.12);
    padding:4px 10px; border-radius:999px;
  }
  #jitsiContainer{ width:100%; height:calc(100vh - 46px); }
  #loadingMsg{ color:#fff; text-align:center; padding:60px 20px; font-family:inherit; }
</style>
</head>
<body>

<div id="topbar">
  <strong>International Learning Platform — Live Class</strong>
  <span id="watchNote">🛡️ Parental Watch: periodic safety snapshots are taken during this class</span>
  <a href="dashboard.html">← Back to dashboard</a>
</div>

<div id="loadingMsg">Connecting to your class...</div>
<div id="jitsiContainer" style="display:none;"></div>

<!-- Hidden capture rig for Parental Watch — a separate, own-device camera
     feed used only to grab periodic still frames. It is not shown on
     screen and is not part of the Jitsi call itself. -->
<video id="watchVideo" autoplay playsinline muted style="display:none;"></video>
<canvas id="watchCanvas" style="display:none;"></canvas>

<script src="app.js"></script>
<script>
  const user = currentUser();
  if (!user){ location.href = 'login.html?next=' + encodeURIComponent(location.pathname + location.search); }

  const params = new URLSearchParams(location.search);
  // "with" = the other person's user ID — the classroom is a PERSISTENT
  // room shared by this pair of people, available any time either side
  // wants a class, regardless of any specific booking's status.
  const otherUserId = params.get('with') || params.get('request'); // "request" kept for old links

  if (!otherUserId){
    document.getElementById('loadingMsg').textContent = 'Missing class link. Please open this page from your Requests or Messages page.';
  } else {
    joinClass();
  }

  async function joinClass(){
    let tokenData;
    try{
      tokenData = await apiRequest('/jitsi-token/' + otherUserId);
    }catch(err){
      document.getElementById('loadingMsg').textContent = 'Could not start the classroom: ' + err.message;
      return;
    }

    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('jitsiContainer').style.display = 'block';

    const displayName = user.firstName + ' ' + user.lastName;

    const options = {
      roomName: tokenData.roomName,
      jwt: tokenData.token,
      parentNode: document.getElementById('jitsiContainer'),
      width: '100%',
      height: '100%',
      userInfo: { displayName: displayName },
      configOverwrite: {
        prejoinPageEnabled: true,
      },
      interfaceConfigOverwrite: {
        SHOW_JITSI_WATERMARK: false,
        SHOW_WATERMARK_FOR_GUESTS: false,
      },
    };

    const api = new JitsiMeetExternalAPI(tokenData.domain, options);

    api.addEventListener('readyToClose', () => {
      stopParentalWatch();
      location.href = 'dashboard.html';
    });

    setTimeout(startParentalWatch, 15000);
  }

  // ---------------- Parental Watch ----------------
  let watchStream = null;
  let watchTimer = null;
  let watchActive = false;

  async function startParentalWatch(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    try{
      watchStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      const video = document.getElementById('watchVideo');
      video.srcObject = watchStream;
      watchActive = true;
      scheduleNextCapture();
    }catch(err){
      console.warn('Parental Watch snapshot camera unavailable:', err.message);
    }
  }

  function stopParentalWatch(){
    watchActive = false;
    if (watchTimer) clearTimeout(watchTimer);
    if (watchStream){
      watchStream.getTracks().forEach(t => t.stop());
      watchStream = null;
    }
  }

  function scheduleNextCapture(){
    if (!watchActive) return;
    const delay = 120000 + Math.random() * 120000;
    watchTimer = setTimeout(captureSnapshot, delay);
  }

  async function captureSnapshot(){
    if (!watchActive) return;
    try{
      const video = document.getElementById('watchVideo');
      const canvas = document.getElementById('watchCanvas');
      if (video.videoWidth && video.videoHeight){
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.7));
        if (blob){
          const file = new File([blob], 'snapshot.jpg', { type: 'image/jpeg' });
          const imageUrl = await apiUpload(file, 'image');
          await apiRequest('/snapshots', {
            method: 'POST',
            body: JSON.stringify({ otherUserId, imageUrl }),
          });
        }
      }
    }catch(err){
      console.warn('Parental Watch snapshot failed (skipping this one):', err.message);
    }finally{
      scheduleNextCapture();
    }
  }
</script>
</body>
</html>
