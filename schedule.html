<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule — International Learning Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="Profile">
<div id="nav"></div>

<section style="padding:40px 0;">
  <div class="container">
    <div class="profile-layout">
      <aside class="profile-sidebar" id="scheduleSidebar"></aside>

      <div style="flex:1;min-width:0;">

        <div class="sched-head">
          <div class="eyebrow">Teaching hours</div>
          <h2 style="margin:0;">My Calendar</h2>
          <p style="margin:.35em 0 0;color:var(--ink-2);font-size:.9rem;">Tap a date, then tap the hours you're free. Booked classes show automatically.</p>
        </div>

        <div id="calCard" class="card sched-card" style="display:none;">
          <div class="sched-card-head">
            <div class="tz-row">
              <label for="tzSelect">Your timezone</label>
              <select id="tzSelect" onchange="onTimezoneChange()"></select>
              <span id="tzCurrentTime" class="tz-current"></span>
            </div>
            <div class="month-nav">
              <button class="month-arrow" onclick="changeMonth(-1)" aria-label="Previous month">‹</button>
              <span id="monthLabel"></span>
              <button class="month-arrow" onclick="changeMonth(1)" aria-label="Next month">›</button>
            </div>
          </div>
          <span id="availStatus" class="save-status" style="display:block;margin-bottom:12px;"></span>

          <div id="calendarGrid" class="calendar-grid"></div>

          <div id="dayAgenda" class="day-agenda"></div>

          <p class="hg-hint">
            <span class="legend-swatch legend-free"></span> Free
            <span class="legend-swatch legend-booked"></span> Booked class
            <span class="legend-swatch legend-empty"></span> Not set
          </p>
        </div>

      </div>
    </div>
  </div>
</section>

<div id="footer"></div>
<script src="app.js"></script>
<script>
  const user = currentUser();
  if (!user){ location.href = 'login.html?next=schedule.html'; }
  const isTutor = user.role === 'TUTOR';

  function sidebar(active){
    const findLink = isTutor
      ? `<a href="students.html" class="side-link ${active==='find'?'active':''}">Find Students</a>`
      : `<a href="tutors.html" class="side-link ${active==='find'?'active':''}">Find a Tutor</a>`;
    return `
      <a href="dashboard.html" class="side-link ${active==='dashboard'?'active':''}">Dashboard</a>
      <a href="profile.html" class="side-link ${active==='profile'?'active':''}">Profile</a>
      ${findLink}
      <a href="requests.html" class="side-link ${active==='requests'?'active':''}" style="display:flex;align-items:center;justify-content:space-between;">
        <span>Requests</span>
        <span id="requestsBadge" style="display:none;background:#c0392b;color:#fff;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 7px;min-width:18px;text-align:center;"></span>
      </a>
      <a href="schedule.html" class="side-link ${active==='schedule'?'active':''}">Schedule</a>
      <a href="messages.html" class="side-link" style="display:flex;align-items:center;justify-content:space-between;">
        <span>Messages</span>
        <span id="messagesBadge" style="display:none;background:#c0392b;color:#fff;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 7px;min-width:18px;text-align:center;"></span>
      </a>
      <a href="payments.html" class="side-link">Payments</a>
      <button class="side-link" id="notifBtn" style="border:none;background:none;text-align:left;cursor:pointer;width:100%;font:inherit;color:var(--ink-2,#555);display:flex;align-items:center;gap:6px;" onclick="handleEnableNotifications(this)"><span id="notifBell">🔴</span><span id="notifLabel" style="color:#c0392b;font-weight:600;">Notifications off</span></button>
      <a href="#" class="side-link" onclick="logout();return false;">Log out</a>
      <a href="#" class="side-link" style="color:#c0392b;" onclick="handleDeactivateAccount();return false;">Deactivate account</a>
    `;
  }
  document.getElementById('scheduleSidebar').innerHTML = sidebar('schedule');

  async function handleDeactivateAccount(){
    if (!confirm('Deactivate your account? Your profile will be hidden from tutors/students, and you will not be able to log in again unless you contact support. This cannot be undone by yourself.')) return;
    try{ await deactivateAccount(); alert('Your account has been deactivated.'); logout(); }
    catch(err){ alert(err.message); }
  }
  window.handleDeactivateAccount = handleDeactivateAccount;

  async function refreshNotifButtonState(){
    const bell = document.getElementById('notifBell');
    const label = document.getElementById('notifLabel');
    if (!bell || !label) return;
    try{
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      const registration = await navigator.serviceWorker.getRegistration();
      const subscription = registration ? await registration.pushManager.getSubscription() : null;
      if (subscription && Notification.permission === 'granted'){
        bell.textContent = '🟢'; label.textContent = 'Notifications on'; label.style.color = '#1e7d43';
      }
    }catch(err){ /* ignore */ }
  }
  async function handleEnableNotifications(btn){
    btn.disabled = true;
    const bell = document.getElementById('notifBell');
    const label = document.getElementById('notifLabel');
    try{
      await enablePushNotifications();
      if (bell) bell.textContent = '🟢';
      if (label){ label.textContent = 'Notifications on'; label.style.color = '#1e7d43'; }
    }catch(err){ alert(err.message); btn.disabled = false; }
  }
  window.handleEnableNotifications = handleEnableNotifications;

  async function refreshRequestsBadge(){
    const badge = document.getElementById('requestsBadge');
    if (!badge) return;
    try{
      const { requests } = await fetchMyTrialRequests();
      const pendingForMe = requests.filter(r => {
        const iAmReceiver = r.initiatedBy === 'TUTOR' ? !isTutor : isTutor;
        return r.status === 'PENDING' && iAmReceiver;
      }).length;
      if (pendingForMe > 0){ badge.textContent = pendingForMe; badge.style.display = 'inline-block'; }
    }catch(err){ /* ignore */ }
  }
  async function refreshMessagesBadge(){
    const badge = document.getElementById('messagesBadge');
    if (!badge) return;
    try{
      const count = await getUnreadMessageCount();
      if (count > 0){ badge.textContent = count; badge.style.display = 'inline-block'; }
    }catch(err){ /* ignore */ }
  }
  refreshNotifButtonState();
  refreshRequestsBadge();
  refreshMessagesBadge();

  /* ================================================================
     Month calendar + 24-hour day agenda.
     Availability is stored as a recurring weekly pattern (per weekday),
     so tapping a date edits the hours for THAT WEEKDAY, every week.
     Booked classes are actual dated lessons and always take priority
     over the recurring pattern in the display.
     ================================================================ */
  const DAY_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let mySlots = [];          // recurring weekly pattern: [{dayOfWeek,startTime,endTime}]
  let monthClasses = [];     // booked classes in the visible month
  let myTimezone = 'UTC';
  let viewYear, viewMonth;   // viewMonth: 0-11
  let selectedDate = null;   // a Date, or null
  let autoSaveTimer = null;

  const FALLBACK_TIMEZONES = [
    'UTC','Pacific/Midway','Pacific/Honolulu','America/Anchorage','America/Los_Angeles',
    'America/Denver','America/Chicago','America/New_York','America/Sao_Paulo',
    'Atlantic/Azores','Europe/London','Europe/Paris','Europe/Berlin','Europe/Moscow',
    'Africa/Cairo','Africa/Lagos','Africa/Johannesburg','Asia/Istanbul','Asia/Dubai',
    'Asia/Karachi','Asia/Kolkata','Asia/Dhaka','Asia/Bangkok','Asia/Jakarta',
    'Asia/Shanghai','Asia/Singapore','Asia/Tokyo','Asia/Seoul','Australia/Perth',
    'Australia/Sydney','Pacific/Auckland',
  ];

  function fmtHour(h){
    const ap = h >= 12 ? 'pm' : 'am';
    let hh = h % 12; if (hh === 0) hh = 12;
    return `${hh}:00${ap}`;
  }
  function isValidTimezone(tz){
    try{ new Intl.DateTimeFormat('en-US', { timeZone: tz }); return true; }
    catch(e){ return false; }
  }
  function sameDate(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

  /* ---------- Timezone (isolated — never blocks the calendar) ---------- */
  function populateTimezones(){
    try{
      const sel = document.getElementById('tzSelect');
      let zones = (typeof Intl.supportedValuesOf === 'function')
        ? Intl.supportedValuesOf('timeZone')
        : FALLBACK_TIMEZONES.slice();
      const browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      if (!zones.includes(browserTz)) zones.push(browserTz);
      if (myTimezone && !zones.includes(myTimezone)) zones.push(myTimezone);
      zones.sort();
      sel.innerHTML = zones.map(z => `<option value="${z}">${z.replace(/_/g,' ')}</option>`).join('');
      const wanted = (myTimezone && isValidTimezone(myTimezone)) ? myTimezone : browserTz;
      sel.value = wanted;
      if (sel.value !== wanted) sel.selectedIndex = 0;
      myTimezone = sel.value;
      updateTzClock();
    }catch(err){
      const tzBox = document.querySelector('.tz-row');
      if (tzBox) tzBox.style.display = 'none';
    }
  }
  function updateTzClock(){
    try{
      const sel = document.getElementById('tzSelect');
      const now = new Date().toLocaleTimeString('en-US', { timeZone: sel.value, hour:'numeric', minute:'2-digit' });
      document.getElementById('tzCurrentTime').textContent = 'Current time there: ' + now;
    }catch(err){ /* cosmetic only */ }
  }
  async function onTimezoneChange(){
    myTimezone = document.getElementById('tzSelect').value;
    updateTzClock();
    const status = document.getElementById('availStatus');
    try{
      await saveProfile(user.email, { timezone: myTimezone });
      if (status){ status.textContent = 'Timezone saved ✓'; status.className = 'save-status success'; }
    }catch(err){
      if (status){ status.textContent = 'Could not save timezone: ' + err.message; status.className = 'save-status error'; }
    }
  }
  window.onTimezoneChange = onTimezoneChange;

  /* ---------- Month calendar ---------- */
  function formatMonthLabel(y, m){
    return new Date(y, m, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  }
  function classesOnDay(y, m, d){
    return monthClasses.filter(c => {
      const dt = new Date(c.scheduledAt);
      return dt.getFullYear() === y && dt.getMonth() === m && dt.getDate() === d;
    });
  }
  function weekdayHasAvailability(dayOfWeek){
    return mySlots.some(s => s.dayOfWeek === dayOfWeek);
  }

  function renderCalendarGrid(){
    const grid = document.getElementById('calendarGrid');
    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const today = new Date();

    let html = '<div class="cal-weekdays">' + DAY_SHORT.map(d => `<div>${d}</div>`).join('') + '</div>';
    html += '<div class="cal-days">';
    for (let i = 0; i < firstDay; i++) html += '<div class="cal-cell empty"></div>';
    for (let d = 1; d <= daysInMonth; d++){
      const dateObj = new Date(viewYear, viewMonth, d);
      const dayClasses = classesOnDay(viewYear, viewMonth, d);
      const isToday = sameDate(dateObj, today);
      const isSelected = selectedDate && sameDate(dateObj, selectedDate);
      const hasAvail = weekdayHasAvailability(dateObj.getDay());
      html += `<button type="button" class="cal-cell ${isToday?'today':''} ${dayClasses.length?'has-class':''} ${isSelected?'selected':''} ${hasAvail?'has-avail':''}" onclick="showDay(${d})">
        <span class="cal-daynum">${d}</span>
        ${dayClasses.length ? `<span class="cal-dot">${dayClasses.length > 1 ? dayClasses.length : ''}</span>` : ''}
      </button>`;
    }
    html += '</div>';
    grid.innerHTML = html;
  }

  async function loadMonth(){
    document.getElementById('monthLabel').textContent = formatMonthLabel(viewYear, viewMonth);
    const start = new Date(viewYear, viewMonth, 1);
    const end = new Date(viewYear, viewMonth + 1, 0, 23, 59, 59);
    try{
      monthClasses = await fetchMyCalendar(start.toISOString(), end.toISOString());
    }catch(err){
      monthClasses = [];
    }
    renderCalendarGrid();
    renderDayAgendaEmpty();
  }

  function renderDayAgendaEmpty(){
    document.getElementById('dayAgenda').innerHTML = `
      <div class="agenda-empty">
        <div class="agenda-empty-icon">🗓</div>
        <p>Tap a date above to set your hours for that day.</p>
      </div>`;
  }

  function changeMonth(delta){
    viewMonth += delta;
    if (viewMonth < 0){ viewMonth = 11; viewYear--; }
    if (viewMonth > 11){ viewMonth = 0; viewYear++; }
    selectedDate = null;
    loadMonth();
  }
  window.changeMonth = changeMonth;

  /* ---------- 24-hour day agenda ---------- */
  function otherPartyName(c){
    const person = isTutor ? c.student : c.tutor;
    return (person.firstName||'') + ' ' + (person.lastName||'');
  }
  function bookedAtHour(date, hour){
    return monthClasses.find(c => {
      const dt = new Date(c.scheduledAt);
      return sameDate(dt, date) && dt.getHours() === hour;
    });
  }
  function isAvailableHour(dayOfWeek, hour){
    const t = String(hour).padStart(2,'0') + ':00';
    return mySlots.some(s => s.dayOfWeek === dayOfWeek && s.startTime <= t && s.endTime > t);
  }

  function showDay(d){
    selectedDate = new Date(viewYear, viewMonth, d);
    renderCalendarGrid();
    renderDayAgenda();
  }
  window.showDay = showDay;

  function renderDayAgenda(){
    const el = document.getElementById('dayAgenda');
    const dayOfWeek = selectedDate.getDay();
    const dateLabel = selectedDate.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });

    let rows = '';
    for (let h = 0; h < 24; h++){
      const booked = bookedAtHour(selectedDate, h);
      const free = isAvailableHour(dayOfWeek, h);
      let cls = 'da-row';
      let label = fmtHour(h);
      let statusText = '';
      if (booked){
        cls += ' booked';
        statusText = `Booked — ${otherPartyName(booked)}`;
      } else if (free){
        cls += ' free';
        statusText = 'Available';
      } else {
        statusText = '';
      }
      rows += `<button type="button" class="${cls}" data-hour="${h}" onclick="onHourClick(${h})">
                 <span class="da-time">${label}</span>
                 <span class="da-status">${statusText}</span>
                 ${booked && booked.meetingLink ? `<a href="${booked.meetingLink}" target="_blank" class="da-join" onclick="event.stopPropagation()">Join</a>` : ''}
               </button>`;
    }

    el.innerHTML = `
      <div class="agenda-head">${dateLabel} <span class="agenda-note">— hours you set repeat every ${DAY_SHORT[dayOfWeek]}</span></div>
      <div class="day-hour-list">${rows}</div>
    `;
  }

  function onHourClick(hour){
    const booked = bookedAtHour(selectedDate, hour);
    if (booked) return; // booked hours aren't editable here

    const dayOfWeek = selectedDate.getDay();
    const start = String(hour).padStart(2,'0') + ':00';
    const end = String(hour+1).padStart(2,'0') + ':00';
    const already = isAvailableHour(dayOfWeek, hour);

    if (already){
      mySlots = mySlots.filter(s => !(s.dayOfWeek === dayOfWeek && s.startTime === start));
    } else {
      mySlots.push({ dayOfWeek, startTime: start, endTime: end });
    }
    renderDayAgenda();
    renderCalendarGrid();
    scheduleAutoSave();
  }
  window.onHourClick = onHourClick;

  function scheduleAutoSave(){
    const status = document.getElementById('availStatus');
    if (status){ status.textContent = 'Saving…'; status.className = 'save-status pending'; }
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(async () => {
      try{
        mySlots = await saveMyAvailability(mySlots);
        if (status){ status.textContent = 'Saved ✓'; status.className = 'save-status success'; }
      }catch(err){
        if (status){ status.textContent = 'Could not save: ' + err.message; status.className = 'save-status error'; }
      }
    }, 800);
  }

  async function loadCalendar(){
    document.getElementById('calCard').style.display = 'block';

    if (isTutor){
      try{ mySlots = await fetchMyAvailability(); }
      catch(err){ mySlots = []; }
    }

    const now = new Date();
    viewYear = now.getFullYear();
    viewMonth = now.getMonth();
    await loadMonth();

    try{
      const profile = await getMyProfile();
      myTimezone = (profile && profile.timezone) || Intl.DateTimeFormat().resolvedOptions().timeZone;
    }catch(err){
      myTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    }
    populateTimezones();
  }

  loadCalendar();
</script>
<style>
  .profile-layout{ display:flex; gap:24px; align-items:flex-start; }
  .profile-sidebar{
    width:180px; flex-shrink:0; display:flex; flex-direction:column; gap:8px;
    border:1px solid var(--line,#eee); border-radius:10px; padding:12px; background:#fff;
  }
  .side-link{ padding:10px 12px; border-radius:8px; text-decoration:none; color:var(--ink-2,#555); font-weight:500; font-size:.92rem; }
  .side-link:hover{ background:#f4f4f4; }
  .side-link.active{ background:var(--green,#1e7d43); color:#fff; }
  .card{ border:1px solid var(--line,#eee); border-radius:12px; padding:20px; background:#fff; }

  .sched-head{ margin-bottom:22px; }
  .sched-head .eyebrow{ margin-bottom:.5em; }
  .sched-card-head{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    flex-wrap:wrap; margin-bottom:10px; padding-bottom:14px; border-bottom:1px solid var(--line);
  }

  .tz-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tz-row label{ font-size:.78rem; font-weight:600; color:var(--ink-2); }
  .tz-row select{ padding:6px 10px; border:1px solid var(--line); border-radius:8px; font-family:var(--sans); font-size:.82rem; }
  .tz-current{ font-size:.76rem; color:var(--ink-2); }

  .month-nav{ display:flex; align-items:center; gap:8px; }
  .month-arrow{ width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:#fff; color:var(--brand-dark); font-size:1rem; cursor:pointer; line-height:1; }
  .month-arrow:hover{ border-color:var(--brand); color:var(--brand); }
  #monthLabel{ font-family:var(--serif); font-weight:700; font-size:.95rem; min-width:140px; text-align:center; display:inline-block; }

  .save-status{ font-size:.82rem; font-weight:600; }
  .save-status.success{ color:var(--brand-dark); }
  .save-status.error{ color:var(--rose); }
  .save-status.pending{ color:var(--ink-2); }

  /* month calendar */
  .cal-weekdays{
    display:grid; grid-template-columns:repeat(7,1fr); text-align:center;
    font-size:.72rem; color:var(--ink-2); font-weight:700; margin-bottom:8px; letter-spacing:.03em;
  }
  .cal-days{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-cell{
    aspect-ratio:1; border:1px solid var(--line); border-radius:10px; background:#fff;
    padding:0; cursor:pointer; position:relative; font-family:var(--sans);
    display:flex; align-items:flex-start; justify-content:flex-start;
  }
  .cal-cell.empty{ border:none; background:none; cursor:default; }
  .cal-daynum{ font-family:var(--serif); font-weight:700; font-size:.95rem; color:var(--ink); padding:8px 0 0 9px; }
  .cal-cell:not(.empty):hover{ border-color:var(--brand); }
  .cal-cell.today{ border-color:var(--brand); border-width:2px; }
  .cal-cell.today .cal-daynum{ color:var(--brand-dark); }
  .cal-cell.has-avail{ background:var(--brand-light); }
  .cal-cell.has-class{ background:var(--brand); }
  .cal-cell.has-class .cal-daynum{ color:#fff; }
  .cal-cell.selected{ box-shadow:0 0 0 2px var(--brand) inset; }
  .cal-dot{
    position:absolute; bottom:7px; right:7px; min-width:9px; height:9px;
    border-radius:999px; background:var(--gold); color:var(--brand-dark);
    font-size:.62rem; font-weight:800; display:flex; align-items:center; justify-content:center; padding:0 3px;
  }

  /* day agenda — 24 hour list */
  .day-agenda{ margin-top:20px; border-top:1px solid var(--line); padding-top:16px; }
  .agenda-empty{ text-align:center; padding:26px 6px; color:var(--ink-2); }
  .agenda-empty-icon{ font-size:1.5rem; margin-bottom:8px; }
  .agenda-empty p{ font-size:.84rem; margin:0; }
  .agenda-head{ font-family:var(--serif); font-weight:700; font-size:1rem; color:var(--brand-dark); margin-bottom:10px; }
  .agenda-note{ font-family:var(--sans); font-weight:500; font-size:.78rem; color:var(--ink-2); }

  .day-hour-list{ display:flex; flex-direction:column; gap:4px; max-height:420px; overflow-y:auto; padding-right:2px; }
  .da-row{
    display:flex; align-items:center; gap:10px; width:100%;
    border:1px solid var(--line); border-radius:8px; background:var(--surface);
    padding:8px 12px; cursor:pointer; font-family:var(--sans); text-align:left;
  }
  .da-row:hover{ border-color:var(--brand); }
  .da-time{ font-size:.82rem; font-weight:700; color:var(--ink-2); width:64px; flex:none; }
  .da-status{ font-size:.8rem; font-weight:700; flex:1; }
  .da-row.free{ background:var(--brand); border-color:var(--brand-dark); }
  .da-row.free .da-time,.da-row.free .da-status{ color:#fff; }
  .da-row.booked{ background:var(--brand-dark); border-color:var(--brand-dark); cursor:default; }
  .da-row.booked .da-time,.da-row.booked .da-status{ color:#fff; }
  .da-join{ font-size:.76rem; font-weight:700; color:#fff; text-decoration:underline; flex:none; }

  .hg-hint{ font-size:.76rem; color:var(--ink-2); margin:16px 0 0; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .legend-swatch{ display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:4px; vertical-align:-2px; border:1px solid var(--line); }
  .legend-free{ background:var(--brand); border-color:var(--brand-dark); }
  .legend-booked{ background:var(--brand-dark); border-color:var(--brand-dark); }
  .legend-empty{ background:var(--surface); }

  @media (max-width:720px){
    .profile-layout{ flex-direction:column; }
    .profile-sidebar{ width:100%; flex-direction:row; flex-wrap:wrap; }
    .cal-cell{ font-size:.75rem; }
    .cal-daynum{ font-size:.82rem; padding:6px 0 0 6px; }
  }
</style>
</body>
</html>
