<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Profile — International Learning Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="Profile">
<div id="nav"></div>

<section style="padding:48px 0;">
  <div class="container">
    <div id="profileWrap"><p style="color:var(--ink-2);">Loading your profile...</p></div>
  </div>
</section>

<div id="footer"></div>
<script src="app.js"></script>
<script>
  const user = currentUser();
  if (!user){ location.href = 'login.html?next=profile.html'; }

  function row(label, value){
    if (value === undefined || value === null || value === '' || (Array.isArray(value) && !value.length)) return '';
    const display = Array.isArray(value) ? value.join(', ') : value;
    return `<div class="profile-row"><span class="profile-label">${label}</span><span class="profile-value">${display}</span></div>`;
  }

  function statusPill(status){
    const map = { NONE:'No certificate submitted', PENDING:'Pending review', APPROVED:'Approved ✓', REJECTED:'Rejected — please re-upload a genuine certificate' };
    const color = status==='APPROVED' ? 'var(--gold,#2e7d32)' : status==='REJECTED' ? 'var(--rose,#c0392b)' : 'var(--ink-2)';
    return `<span style="color:${color};font-weight:600;">${map[status] || status}</span>`;
  }

  async function load(){
    const wrap = document.getElementById('profileWrap');
    try{
      const { profile } = await getMyProfile();
      const isTutor = user.role === 'TUTOR';
      const name = user.firstName + ' ' + user.lastName;

      let picHtml = profile && profile.pictureUrl
        ? `<img src="${profile.pictureUrl}" style="width:96px;height:96px;border-radius:50%;object-fit:cover;">`
        : `<div class="avatar avatar-lg">${initials(name)}</div>`;

      let body = '';
      if (!profile){
        body = `<p style="color:var(--ink-2);">You haven't completed your profile yet.</p>
                <a href="profile-setup.html" class="btn primary small">Complete your profile</a>`;
      } else if (isTutor){
        body = `
          <div class="profile-card">
            ${row('Gender', profile.gender)}
            ${row('Country', profile.country)}
            ${row('Phone', profile.phone)}
            ${row('WhatsApp', profile.whatsapp)}
            ${row('Subjects', profile.subjects)}
            ${row('Teaches', profile.ageGroupsTaught)}
            ${row('Platform', profile.platform)}
            ${row('Availability', profile.availability)}
            ${row('Experience', profile.experience)}
            ${row('Qualification', profile.qualification)}
            ${row('Bio', profile.bio)}
            ${row('Price', profile.price ? '$' + profile.price + ' / class' : '')}
            ${row('Languages', profile.languages)}
            <div class="profile-row"><span class="profile-label">Listed publicly</span><span class="profile-value">${profile.isListed ? 'Yes — students can find and book you ✓' : 'Not yet — complete every required field to appear in search'}</span></div>
            ${profile.certificationUrl ? `<div class="profile-row"><span class="profile-label">Certificate (${profile.certificationType||'—'})</span><span class="profile-value">${statusPill(profile.certificationStatus)}</span></div>` : ''}
            ${profile.audioSampleUrl ? `<div class="profile-row"><span class="profile-label">Recitation sample</span><span class="profile-value"><audio controls src="${profile.audioSampleUrl}" style="max-width:220px;"></audio></span></div>` : ''}
          </div>
          <a href="profile-setup.html" class="btn ghost small" style="margin-top:16px;">Edit profile</a>`;
      } else {
        body = `
          <div class="profile-card">
            ${row('Gender', profile.gender)}
            ${row('Country', profile.country)}
            ${row('Age group', profile.ageGroup)}
            ${row('Phone', profile.phone)}
            ${row('WhatsApp', profile.whatsapp)}
            ${row('Wants to learn', profile.interests)}
            ${row('Languages', profile.languages)}
            ${row('Availability', profile.availability)}
            ${row('About', profile.bio)}
          </div>
          <a href="profile-setup.html" class="btn ghost small" style="margin-top:16px;">Edit profile</a>`;
      }

      wrap.innerHTML = `
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;">
          ${picHtml}
          <div>
            <h2 style="margin-bottom:.1em;">${name}</h2>
            <p style="margin:0;color:var(--ink-2);">${isTutor ? 'Tutor account' : 'Student account'} · ${user.email}</p>
          </div>
        </div>
        ${body}
        <div style="margin-top:24px;">
          <a href="dashboard.html" class="btn ghost small">View trial requests</a>
        </div>`;
    }catch(err){
      wrap.innerHTML = `<p style="color:var(--rose);">Could not load your profile: ${err.message}</p>`;
    }
  }

  load();
</script>
<style>
  .profile-card{ display:flex; flex-direction:column; gap:0; border:1px solid var(--line,#eee); border-radius:10px; overflow:hidden; }
  .profile-row{ display:flex; justify-content:space-between; gap:16px; padding:12px 16px; border-bottom:1px solid var(--line,#eee); }
  .profile-row:last-child{ border-bottom:none; }
  .profile-label{ color:var(--ink-2,#888); font-size:.85rem; flex-shrink:0; }
  .profile-value{ text-align:right; font-weight:500; }
</style>
</body>
</html>
