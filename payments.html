<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments — International Learning Platform</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body data-page="">
<div id="nav"></div>

<section style="padding:40px 0;">
  <div class="container">
    <div id="payWrap"><p style="color:var(--ink-2);">Loading...</p></div>
  </div>
</section>

<div id="qrModalOverlay" class="qr-modal-overlay" style="display:none;" onclick="if(event.target===this) closeQrModal();">
  <div class="qr-modal-box">
    <button type="button" class="qr-modal-close" onclick="closeQrModal()">✕</button>
    <p class="qr-modal-title">Scan with your phone's camera</p>
    <div id="qrCodeMount"></div>
    <p class="qr-modal-hint">This contains the account details. Scan it with your phone, then open the app on your phone to send the payment.</p>
  </div>
</div>

<div id="footer"></div>
<script src="app.js"></script>
<script>
  const user = currentUser();
  if (!user){ location.href = 'login.html?next=payments.html'; }
  const isTutor = user.role === 'TUTOR';

  let acceptedRequests = [];
  let myPayments = [];
  let myProfile = null;
  let platformMethods = []; // NEW: the platform's own accounts — this is who students pay

  // Apps that have ONE official Android package (used for the mobile "Open" button).
  const APP_PACKAGES = {
    'JazzCash': 'com.techlogix.mobilinkcustomer',
    'Easypaisa': 'pk.com.telenor.phoenix',
    'Payoneer': 'com.payoneer.android',
    'NayaPay': 'com.nayapay.app',
    'PayPal': 'com.paypal.android.p2pmobile',
  };

  // Methods that ALSO have a real website usable on a computer.
  const DESKTOP_URLS = {
    'PayPal': 'https://www.paypal.com/signin',
    'Payoneer': 'https://myaccount.payoneer.com/',
  };

  const METHOD_COLORS = {
    'JazzCash': '#e6231e',
    'Easypaisa': '#00a651',
    'Payoneer': '#ff4800',
    'NayaPay': '#0057ff',
    'PayPal': '#003087',
    'Bank Transfer': '#2c3e50',
    'Wise': '#00b9ff',
    'Other': '#6b7280',
  };

  function isAndroid(){ return /Android/i.test(navigator.userAgent); }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function statusColor(status){
    return { PENDING:'#b8860b', CONFIRMED:'#1e7d43', REJECTED:'#c0392b' }[status] || '#888';
  }

  function payoutStatusLabel(status){
    return { NOT_APPLICABLE: '', PENDING: 'Payout pending', PAID: 'Payout sent ✓' }[status] || '';
  }

  function fmtMoney(amount, currency){
    return `${currency || 'USD'} ${Number(amount).toFixed(2)}`;
  }

  function fmtDate(iso){
    try{ return new Date(iso).toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
    catch(e){ return iso; }
  }

  function avatarHtml(name, pictureUrl){
    return pictureUrl
      ? `<img src="${pictureUrl}" class="pay-avatar-img">`
      : `<div class="avatar">${initials(name || '?')}</div>`;
  }

  function sidebar(active){
    const findLink = isTutor
      ? `<a href="students.html" class="side-link">Find Students</a>`
      : `<a href="tutors.html" class="side-link">Find a Tutor</a>`;
    return `
      <a href="dashboard.html" class="side-link">Dashboard</a>
      <a href="profile.html" class="side-link">Profile</a>
      ${findLink}
      <a href="requests.html" class="side-link">Requests</a>
      <a href="messages.html" class="side-link">Messages</a>
      <a href="payments.html" class="side-link ${active==='payments'?'active':''}">Payments</a>
      <a href="#" class="side-link" onclick="logout();return false;">Log out</a>`;
  }

  /* ---------- QR modal ---------- */
  function showQrCode(text){
    const mount = document.getElementById('qrCodeMount');
    mount.innerHTML = '';
    new QRCode(mount, { text: text, width: 200, height: 200 });
    document.getElementById('qrModalOverlay').style.display = 'flex';
  }
  function closeQrModal(){
    document.getElementById('qrModalOverlay').style.display = 'none';
  }
  window.closeQrModal = closeQrModal;

  /* ---------- one payment-method row: colored badge + details + Copy + smart Open ---------- */
  function methodRowHtml(m, opts={}){
    const color = METHOD_COLORS[m.method] || '#6b7280';
    const packageName = APP_PACKAGES[m.method];
    const desktopUrl = DESKTOP_URLS[m.method] || '';
    return `
      <div class="pm-row">
        ${opts.selectable ? `<input type="radio" name="platformMethodRadio" value="${escapeHtml(m.method)}" ${opts.checked ? 'checked' : ''}>` : ''}
        <div class="pm-body">
          <div class="pm-badge" style="background:${color};">${escapeHtml(m.method)}</div>
          <div class="pm-details">${escapeHtml(m.details)}</div>
          ${m.label ? `<div class="pm-label">${escapeHtml(m.label)}</div>` : ''}
        </div>
        <div class="pm-actions">
          <button type="button" class="btn ghost small pm-copy-btn" data-copy-text="${escapeHtml(m.details)}">📋 Copy</button>
          ${packageName ? `<button type="button" class="btn ghost small pm-smart-btn" data-package="${packageName}" data-desktop-url="${desktopUrl}" data-qr-text="${escapeHtml(m.details)}">📲 Open</button>` : ''}
        </div>
      </div>`;
  }

  /* ---------- STUDENT: payment form (proof upload first) ---------- */
  function paymentFormHtml(){
    if (!acceptedRequests.length){
      return `<p style="color:var(--ink-2);">You don't have any accepted classes yet. Once a tutor accepts your trial request, you'll be able to send a payment here.</p>`;
    }
    const tutorOptions = acceptedRequests.map(r =>
      `<option value="${r.tutor.id}" data-request="${r.id}">${r.tutor.firstName} ${r.tutor.lastName}</option>`
    ).join('');

    const myName = user.firstName + ' ' + user.lastName;

    return `
      <form id="payForm" class="pay-form">
        <div class="field">
          <label>Which tutor / class is this payment for?</label>
          <select name="tutorSelect" id="tutorSelect" required>${tutorOptions}</select>
          <p class="pay-instruction">This is just so we know which class to credit — your payment always goes to the platform's own accounts below, never directly to the tutor.</p>
        </div>

        <div class="pay-two-col">
          <div class="pay-side">
            <div class="pay-side-title">You're paying</div>
            <div class="pay-person">
              ${avatarHtml(myName, myProfile ? myProfile.pictureUrl : null)}
              <div>
                <strong>${escapeHtml(myName)}</strong>
                <div class="pay-email">${escapeHtml(user.email)}</div>
              </div>
            </div>
          </div>

          <div class="pay-arrow">→</div>

          <div class="pay-side" id="platformSidePane">
            <div class="pay-side-title">Sending to (International Learning Platform)</div>
            ${platformMethods.length
              ? `<div class="pm-list">${platformMethods.map((m,i) => methodRowHtml(m, { selectable:true, checked:i===0 })).join('')}</div>`
              : `<p class="pay-hint warn">No payment accounts have been set up yet. Please contact support before sending any payment.</p>`}
          </div>
        </div>

        <p class="pay-instruction" style="margin-top:4px;">Once you've sent the payment above, upload your screenshot as proof:</p>
        <div class="field">
          <input type="file" name="proof" accept="image/*" required>
        </div>

        <div class="field-row" style="margin-top:16px;">
          <div class="field">
            <label>Amount</label>
            <input type="number" name="amount" step="0.01" min="1" placeholder="e.g. 20.00" required>
          </div>
          <div class="field">
            <label>Currency</label>
            <select name="currency">
              <option value="USD">USD</option>
              <option value="PKR">PKR</option>
              <option value="GBP">GBP</option>
              <option value="EUR">EUR</option>
              <option value="AED">AED</option>
              <option value="CAD">CAD</option>
            </select>
          </div>
        </div>
        <div id="payMsg" class="msg"></div>
        <button type="submit" class="btn primary block">I've sent this payment</button>
      </form>`;
  }

  /* ---------- Copy + smart Open button wiring ---------- */
  function wirePmButtons(scope){
    scope.querySelectorAll('.pm-copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const text = btn.dataset.copyText;
        navigator.clipboard.writeText(text).then(() => {
          const original = btn.textContent;
          btn.textContent = '✓ Copied';
          setTimeout(() => { btn.textContent = original; }, 1500);
        }).catch(() => {
          alert('Could not copy automatically — please select and copy the details manually.');
        });
      });
    });

    scope.querySelectorAll('.pm-smart-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const packageName = btn.dataset.package;
        const desktopUrl = btn.dataset.desktopUrl;
        const qrText = btn.dataset.qrText;

        if (isAndroid()){
          const fallback = encodeURIComponent(desktopUrl || ('https://play.google.com/store/apps/details?id=' + packageName));
          window.location.href = `intent://#Intent;package=${packageName};S.browser_fallback_url=${fallback};end`;
        } else if (desktopUrl){
          window.open(desktopUrl, '_blank', 'noopener');
        } else {
          showQrCode(qrText);
        }
      });
    });
  }

  function historyListHtml(){
    if (!myPayments.length){
      return `<p style="color:var(--ink-2);">No payments yet.</p>`;
    }
    return myPayments.map(p => `
      <div class="request-card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
          <strong>${fmtMoney(p.amount, p.currency)}</strong>
          <span style="color:${statusColor(p.status)};font-weight:700;font-size:.75rem;text-transform:uppercase;">${p.status}</span>
        </div>
        <div class="req-detail">Method: ${escapeHtml((p.method || '').replace('_',' '))}</div>
        <div class="req-detail">Submitted: ${fmtDate(p.createdAt)}</div>
        ${p.status === 'CONFIRMED' && isTutor ? `<div class="req-detail">Your payout: ${fmtMoney(p.tutorPayout, p.currency)} (after 10% platform fee) — ${payoutStatusLabel(p.payoutStatus)}</div>` : ''}
        ${p.status === 'REJECTED' && p.adminNote ? `<div class="req-detail" style="color:var(--rose);">Reason: ${escapeHtml(p.adminNote)}</div>` : ''}
        <div class="req-detail"><a href="${p.proofUrl}" target="_blank" rel="noopener">View proof</a></div>
      </div>`).join('');
  }

  function renderAll(){
    const wrap = document.getElementById('payWrap');
    wrap.innerHTML = `
      <div class="profile-layout">
        <aside class="profile-sidebar">${sidebar('payments')}</aside>
        <div class="profile-card" style="flex:1;min-width:0;">
          ${!isTutor ? `
            <h2 class="section-heading">Make a Payment</h2>
            <div style="margin-bottom:28px;">${paymentFormHtml()}</div>
          ` : ''}
          <h2 class="section-heading">Payment History</h2>
          <div class="request-list">${historyListHtml()}</div>
        </div>
      </div>`;

    if (!isTutor){
      const form = document.getElementById('payForm');
      if (form){
        wirePmButtons(form);
        form.addEventListener('submit', onSubmitPayment);
      }
    }
  }

  async function onSubmitPayment(e){
    e.preventDefault();
    const form = e.target;
    const msg = document.getElementById('payMsg');
    const btn = form.querySelector('button[type="submit"]');
    const select = form.querySelector('select[name="tutorSelect"]');
    const selectedOption = select.options[select.selectedIndex];
    const tutorId = selectedOption.value;
    const requestId = selectedOption.dataset.request;
    const amount = form.amount.value;
    const currency = form.currency.value;
    const methodRadio = form.querySelector('input[name="platformMethodRadio"]:checked');

    if (!methodRadio){
      msg.className = 'msg error';
      msg.textContent = 'Please select which account you sent the payment to.';
      return;
    }
    const method = methodRadio.value;
    const file = form.proof.files[0];

    msg.className = 'msg';
    msg.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    try{
      await submitPayment({ tutorId, amount, currency, method, requestId, file });
      msg.className = 'msg success';
      msg.textContent = 'Payment submitted! We will confirm it shortly.';
      await loadPayments();
      form.reset();
    }catch(err){
      msg.className = 'msg error';
      msg.textContent = err.message;
    }finally{
      btn.disabled = false;
      btn.textContent = "I've sent this payment";
    }
  }

  async function loadPayments(){
    myPayments = (await fetchMyPayments()) || [];
    renderAll();
  }

  async function load(){
    const wrap = document.getElementById('payWrap');
    try{
      if (!isTutor){
        try{ myProfile = await getMyProfile(); }catch(e){ myProfile = null; }
        const { requests } = await fetchMyTrialRequests();
        acceptedRequests = (requests || []).filter(r => r.status === 'ACCEPTED');
        try{ platformMethods = (await fetchPlatformPaymentMethods()) || []; }catch(e){ platformMethods = []; }
      }
      myPayments = (await fetchMyPayments()) || [];
      renderAll();
    }catch(err){
      wrap.innerHTML = `<p style="color:var(--rose,#c0392b);">Could not load payments: ${err.message}</p>`;
    }
  }

  load();
</script>
<style>
  .profile-layout{ display:flex; gap:24px; align-items:flex-start; }
  .profile-sidebar{ width:180px; flex-shrink:0; display:flex; flex-direction:column; gap:8px; border:1px solid var(--line,#eee); border-radius:10px; padding:12px; background:#fff; }
  .side-link{ padding:10px 12px; border-radius:8px; text-decoration:none; color:var(--ink-2,#555); font-weight:500; font-size:.92rem; }
  .side-link:hover{ background:#f4f4f4; }
  .side-link.active{ background:var(--green,#1e7d43); color:#fff; }
  .profile-card{ border:1px solid var(--line,#eee); border-radius:12px; padding:24px; background:#fff; }
  @media (max-width:720px){ .profile-layout{ flex-direction:column; } .profile-sidebar{ width:100%; flex-direction:row; flex-wrap:wrap; } }
  .section-heading{ margin:0 0 12px; font-size:1.1rem; font-weight:800; }
  .section-heading:not(:first-child){ margin-top:8px; }
  .request-list{ display:flex; flex-direction:column; gap:14px; }
  .request-card{ border:1px solid var(--line,#eee); border-radius:10px; padding:16px; background:#fff; }
  .req-detail{ color:var(--ink-2); font-size:.85rem; margin-top:4px; }
  .pay-form .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:560px){ .pay-form .field-row{ grid-template-columns:1fr; } }
  .pay-instruction{ font-size:.85rem; color:var(--ink-2,#666); margin:2px 0 8px; }

  .pay-two-col{ display:grid; grid-template-columns:1fr auto 1fr; gap:16px; align-items:start; margin:16px 0; }
  @media (max-width:720px){ .pay-two-col{ grid-template-columns:1fr; } .pay-arrow{ transform:rotate(90deg); margin:4px auto; } }
  .pay-arrow{ font-size:1.4rem; color:var(--ink-2,#888); align-self:center; }
  .pay-side{ border:1px solid var(--line,#eee); border-radius:10px; padding:14px; background:#fafafa; }
  .pay-side-title{ font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-2,#888); margin-bottom:10px; font-weight:700; }
  .pay-person{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .pay-avatar-img{ width:40px; height:40px; border-radius:50%; object-fit:cover; }
  .pay-email{ font-size:.78rem; color:var(--ink-2,#888); }

  .pm-list{ display:flex; flex-direction:column; gap:10px; }
  .pm-row{ display:flex; align-items:flex-start; gap:8px; background:#fff; border:1px solid var(--line,#eee); border-radius:8px; padding:10px; }
  .pm-row input[type="radio"]{ margin-top:4px; flex-shrink:0; }
  .pm-body{ flex:1; min-width:0; }
  .pm-badge{ display:inline-block; color:#fff; font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:999px; margin-bottom:4px; }
  .pm-details{ font-size:.85rem; color:var(--ink,#222); word-break:break-word; }
  .pm-label{ font-size:.75rem; color:var(--ink-2,#888); margin-top:2px; }
  .pm-actions{ display:flex; flex-direction:column; gap:6px; flex-shrink:0; }

  .pay-hint{ background:#f6f8f6; border:1px solid var(--line,#eee); border-radius:10px; padding:12px 14px; font-size:.85rem; color:var(--ink-2); }
  .pay-hint.warn{ background:#fff6ec; border-color:#f0d9b5; color:#8a5a1f; }

  .qr-modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:2000; display:flex; align-items:center; justify-content:center; padding:20px; }
  .qr-modal-box{ background:#fff; border-radius:14px; padding:24px; max-width:280px; width:100%; text-align:center; position:relative; }
  .qr-modal-close{ position:absolute; top:10px; right:12px; border:none; background:none; font-size:1.1rem; cursor:pointer; color:var(--ink-2,#888); }
  .qr-modal-title{ font-weight:700; margin:0 0 14px; }
  .qr-modal-hint{ font-size:.8rem; color:var(--ink-2,#888); margin:14px 0 0; }
</style>
</body>
</html>
