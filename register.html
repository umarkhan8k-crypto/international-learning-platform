<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — International Learning Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="">
<div id="nav"></div>
<section style="padding:56px 0;">
<div class="container">
<div class="form-shell">
<h2>Create your account</h2>
<p class="form-sub">Join as a student or a tutor — it's free.</p>
<div id="regMsg" class="msg"></div>
<div class="role-toggle">
<button type="button" id="roleStudent" class="active">I'm a student</button>
<button type="button" id="roleTutor">I'm a tutor</button>
</div>
<form id="registerForm">
<div class="grid-2" style="gap:12px;">
<div class="field"><label>First name</label><input type="text" id="firstName" required></div>
<div class="field"><label>Last name</label><input type="text" id="lastName" required></div>
</div>
<div class="field"><label>Email</label><input type="email" id="email" required></div>
<div class="field"><label>Password</label><input type="password" id="password" required minlength="8"></div>
<button type="submit" class="btn primary block">Create account</button>
</form>
<p class="form-foot">Already have an account? <a href="login.html">Log in</a></p>
</div>
</div>
</section>
<div id="footer"></div>
<script src="app.js"></script>
<script>
let role = 'STUDENT';
document.getElementById('roleStudent').addEventListener('click', ()=>{
  role='STUDENT';
  document.getElementById('roleStudent').classList.add('active');
  document.getElementById('roleTutor').classList.remove('active');
});
document.getElementById('roleTutor').addEventListener('click', ()=>{
  role='TUTOR';
  document.getElementById('roleTutor').classList.add('active');
  document.getElementById('roleStudent').classList.remove('active');
});
document.getElementById('registerForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const msg = document.getElementById('regMsg');
  msg.style.display = 'none';
  const submitBtn = e.target.querySelector('button[type=submit]');
  submitBtn.disabled = true;
  try{
    await registerUser({
      firstName: document.getElementById('firstName').value.trim(),
      lastName: document.getElementById('lastName').value.trim(),
      email: document.getElementById('email').value.trim().toLowerCase(),
      password: document.getElementById('password').value,
      role,
    });
    msg.className='msg success'; msg.textContent='Account created! Redirecting to complete your profile...'; msg.style.display='block';
    setTimeout(()=> location.href='profile-setup.html', 900);
  }catch(err){
    msg.className='msg error'; msg.textContent = err.message; msg.style.display='block';
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
