<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Tutors — International Learning Platform</title>
<link rel="stylesheet" href="style.css">
<style>
  .lang-row{ font-size:.78rem; color:var(--ink-2,#888); margin-top:6px; }
</style>
</head>
<body data-page="Find Tutors">
<div id="nav"></div>

<section class="page-hero">
  <div class="container">
    <div class="eyebrow" style="justify-content:center;">Our Teachers</div>
    <h1>Find your perfect Quran tutor</h1>
    <p style="color:var(--ink-2);">Browse tutor profiles and choose based on subject, language and experience.</p>
  </div>
</section>

<section style="padding-top:40px;">
  <div class="container">
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="Search by name, subject or language">
      <select id="subjectFilter">
        <option value="">All subjects</option>
        <option>Hifz</option><option>Tajweed</option><option>Recitation</option>
        <option>Qaida</option><option>Arabic</option>
      </select>
      <select id="genderFilter">
        <option value="">Any gender</option>
        <option>Male</option><option>Female</option>
      </select>
      <input type="text" id="countryFilter" placeholder="Country">
    </div>
    <div class="grid-3" id="tutorGrid"></div>
    <p id="emptyState" style="display:none;text-align:center;color:var(--ink-2);padding:40px 0;">No tutors match your filters yet — try clearing a filter.</p>
    <p id="loadingState" style="text-align:center;color:var(--ink-2);padding:40px 0;">Loading tutors...</p>
  </div>
</section>

<div class="modal-backdrop" id="trialModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h3 id="modalTutorName">Book a free trial</h3>
    <p class="form-sub" id="modalTutorMeta" style="margin-bottom:1.2em;"></p>
    <div id="modalMsg" class="msg"></div>
    <form id="trialForm">
      <div class="field"><label>Preferred day &amp; time</label><input type="text" id="trialTime" placeholder="e.g. Weekdays, evening (GMT+5)" required></div>
      <button class="btn primary block" type="submit">Send trial request</button>
    </form>
  </div>
</div>

<div id="footer"></div>
<script src="app.js"></script>
<script>
  const grid = document.getElementById('tutorGrid');
  const empty = document.getElementById('emptyState');
  const loading = document.getElementById('loadingState');
  let activeTutor = null;

  const params = new URLSearchParams(location.search);
  if (params.get('subject')) document.getElementById('subjectFilter').value = params.get('subject');

  function starRow(r){
    const rating = Number(r) || 0;
    const full = Math.round(rating);
    return '★'.repeat(full) + '☆'.repeat(5-full);
  }

  function avatarHtml(name, pictureUrl){
    return pictureUrl
      ? `<img src="${pictureUrl}" class="avatar" style="object-fit:cover;">`
      : `<div class="avatar">${initials(name)}</div>`;
  }

  async function render(){
    loading.style.display = 'block';
    empty.style.display = 'none';
    grid.innerHTML = '';
    try{
      const q = {};
      const search = document.getElementById('searchInput').value.trim();
      const subj = document.getElementById('subjectFilter').value;
      const gen = document.getElementById('genderFilter').value;
      const country = document.getElementById('countryFilter').value.trim();
      if (search) q.search = search;
      if (subj) q.subject = subj;
      if (gen) q.gender = gen;
      if (country) q.country = country;

      const data = await fetchTutors(q);
      const tutors = data.tutors || [];
      loading.style.display = 'none';
      empty.style.display = tutors.length ? 'none' : 'block';
      grid.innerHTML = tutors.map(t=>{
        const name = t.user.firstName + ' ' + t.user.lastName;
        return `
        <div class="card tutor-card">
          <a href="public-profile.html?id=${t.userId}&role=tutor" style="text-decoration:none;color:inherit;">
            <div class="tutor-top">
              ${avatarHtml(name, t.pictureUrl)}
              <div>
                <div class="tutor-name">${name}</div>
                <div class="tutor-meta">${t.country||''} · ${t.experience||''}</div>
              </div>
            </div>
          </a>
          <div class="stars">${starRow(t.rating)} <span style="color:var(--ink-2);font-weight:500;">${t.rating||'New'} (${t.reviewCount||0})</span></div>
          <div style="font-size:.78rem;color:var(--ink-2,#888);margin-top:2px;">${t.totalClasses||0} classes taught</div>
          <p style="font-size:.87rem;">${t.bio||''}</p>
          <div class="pill-row">
            ${(t.subjects||[]).map(s=>`<span class="pill">${s}</span>`).join('')}
          </div>
          ${(t.languages||[]).length ? `<div class="lang-row">${(t.languages||[]).join(' · ')}</div>` : ''}
          <div class="tutor-bottom">
            <div class="tutor-price">$${t.price||'—'}<small> / class</small></div>
            <button class="btn gold small" onclick="openModal('${t.userId}')">Book trial</button>
          </div>
        </div>`;
      }).join('');
      window.__tutorCache = tutors;

      if (params.get('book')){
        openModal(params.get('book'));
      }
    }catch(err){
      loading.style.display = 'none';
      grid.innerHTML = `<p style="color:var(--rose);text-align:center;">Could not load tutors: ${err.message}</p>`;
    }
  }

  ['searchInput','subjectFilter','genderFilter','countryFilter'].forEach(id=>{
    document.getElementById(id).addEventListener('input', render);
  });
  render();

  function openModal(userId){
    const user = currentUser();
    if (!user){ location.href = 'login.html?next=tutors.html'; return; }
    activeTutor = (window.__tutorCache||[]).find(t=>t.userId===userId);
    if (!activeTutor) return;
    const name = activeTutor.user.firstName + ' ' + activeTutor.user.lastName;
    document.getElementById('modalTutorName').textContent = 'Book a trial with ' + name;
    document.getElementById('modalTutorMeta').textContent = (activeTutor.subjects||[]).join(', ') + ' · $' + activeTutor.price + '/class';
    document.getElementById('modalMsg').style.display = 'none';
    document.getElementById('trialModal').classList.add('open');
  }
  function closeModal(){ document.getElementById('trialModal').classList.remove('open'); }

  document.getElementById('trialForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const msg = document.getElementById('modalMsg');
    const submitBtn = e.target.querySelector('button[type=submit]');
    submitBtn.disabled = true;
    try{
      await createTrialRequestApi({
        tutorId: activeTutor.userId,
        preferredTime: document.getElementById('trialTime').value,
      });
      msg.className = 'msg success';
      msg.textContent = 'Trial request sent! Track its status from your dashboard.';
      msg.style.display = 'block';
      document.getElementById('trialForm').reset();
      setTimeout(closeModal, 1600);
    }catch(err){
      msg.className = 'msg error';
      msg.textContent = err.message;
      msg.style.display = 'block';
    }
    submitBtn.disabled = false;
  });
</script>
</body>
</html>
