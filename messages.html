<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — International Learning Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="">
<div id="nav"></div>

<section style="padding:40px 0;">
  <div class="container">
    <div id="msgWrap"><p style="color:var(--ink-2);">Loading your messages...</p></div>
  </div>
</section>

<div id="footer"></div>
<script src="app.js"></script>
<script>
  const user = currentUser();
  if (!user){ location.href = 'login.html?next=messages.html'; }

  function avatarHtml(name, pictureUrl){
    return pictureUrl
      ? `<img src="${pictureUrl}" class="avatar" style="object-fit:cover;">`
      : `<div class="avatar">${initials(name)}</div>`;
  }

  // Small "Aug 30, 5:42 PM" / "Today, 5:42 PM" style stamp for the top of a card.
  function fmtStamp(iso){
    try{
      const d = new Date(iso);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
      const isYesterday = d.toDateString() === yesterday.toDateString();
      const time = d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
      if (sameDay) return `Today, ${time}`;
      if (isYesterday) return `Yesterday, ${time}`;
      return `${d.toLocaleDateString(undefined, { month:'short', day:'numeric' })}, ${time}`;
    }catch(e){ return ''; }
  }

  // Escapes HTML special characters so message text can never inject markup —
  // needed before we selectively turn URLs back into real links below.
  function escapeHtml(str){
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Turns any http(s) link typed inside a message into a tappable link —
  // this is how a Zoom / Google Meet / Skype / WhatsApp class link shared
  // in chat becomes something the other person can just tap to join.
  function linkifyMessage(text){
    const escaped = escapeHtml(text);
    return escaped.replace(/(https?:\/\/[^\s<]+)/g, (url) => {
      const trailingPunct = /[.,!?)\]]+$/;
      const trimmed = url.match(trailingPunct) ? url.replace(trailingPunct, '') : url;
      const suffix = url.slice(trimmed.length);
      return `<a href="${trimmed}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:underline;font-weight:600;word-break:break-all;">${trimmed}</a>${suffix}`;
    });
  }

  function conversationCard(c){
    const name = (c.other.firstName||'') + ' ' + (c.other.lastName||'');
    const roleLabel = c.otherRole === 'TUTOR' ? 'Tutor' : 'Student';
    const profile = c.otherProfile || {};
    const metaParts = [profile.country, (profile.languages||[]).join(' · ')].filter(Boolean);
    const hasMessage = !!c.lastMessage;
    const mine = hasMessage && c.lastMessage.senderId === user.id;
    const previewPrefix = mine ? 'You: ' : '';
    const previewText = hasMessage ? (previewPrefix + c.lastMessage.content) : 'No messages yet — say hello.';

    return `
      <div class="conv-card" data-other="${c.otherId}">
        <div class="conv-top">
          ${avatarHtml(name, profile.pictureUrl)}
          <div class="conv-who">
            <div class="conv-name-row">
              <strong>${name}</strong>
              <span class="role-chip">${roleLabel}</span>
            </div>
            ${metaParts.length ? `<div class="conv-meta">${metaParts.join(' · ')}</div>` : ''}
          </div>
          <div class="conv-stamp">${hasMessage ? fmtStamp(c.lastMessage.createdAt) : ''}</div>
          ${c.unreadCount > 0 ? `<span class="conv-badge">${c.unreadCount}</span>` : ''}
        </div>

        <div class="conv-preview-wrap">
          <p class="conv-preview">${escapeHtml(previewText)}</p>
          <span class="conv-readmore">Read more</span>
        </div>

        <div class="conv-thread" style="display:none;"></div>
      </div>`;
  }

  function statusOfPreview(card){
    const preview = card.querySelector('.conv-preview');
    const readmore = card.querySelector('.conv-readmore');
    // Only show "Read more" if the text is actually being clipped by the 2-line limit.
    if (preview.scrollHeight > preview.clientHeight + 2){
      readmore.style.display = 'inline-block';
    } else {
      readmore.style.display = 'none';
    }
  }

  async function loadThreadInto(otherId, threadEl){
    threadEl.innerHTML = '<p style="color:var(--ink-2);font-size:.85rem;padding:12px 0;">Loading messages...</p>';
    try{
      const { messages } = await apiRequest('/messages/thread/' + otherId);
      renderThread(otherId, threadEl, messages);
      // Reading the thread just cleared unread on the server — reflect that locally.
      const card = threadEl.closest('.conv-card');
      const badge = card.querySelector('.conv-badge');
      if (badge) badge.remove();
      refreshMessagesBadge();
    }catch(err){
      threadEl.innerHTML = `<p style="color:var(--rose,#c0392b);font-size:.85rem;">${escapeHtml(err.message)}</p>`;
    }
  }

  function renderThread(otherId, threadEl, messages){
    const msgsHtml = messages.length
      ? messages.map(m => {
          const mine = m.senderId === user.id;
          return `<div style="display:flex;justify-content:${mine?'flex-end':'flex-start'};margin-bottom:6px;">
            <div style="max-width:78%;padding:8px 12px;border-radius:12px;background:${mine?'var(--green,#1e7d43)':'#f0f0f0'};color:${mine?'#fff':'#222'};font-size:.88rem;white-space:pre-wrap;">
              ${linkifyMessage(m.content)}
            </div>
          </div>`;
        }).join('')
      : '<p style="color:var(--ink-2);font-size:.85rem;">No messages yet — say hello.</p>';

    threadEl.innerHTML = `
      <div class="chat-scroll" style="max-height:260px;overflow-y:auto;padding:10px;border:1px solid var(--line,#eee);border-radius:8px;margin:10px 0;">
        ${msgsHtml}
      </div>
      <p style="font-size:.75rem;color:var(--ink-2);margin:0 0 8px;">Tip: paste a Zoom, Google Meet, Skype or WhatsApp link here when you're ready for class — it becomes tappable automatically.</p>
      <form class="chat-form" style="display:flex;gap:8px;">
        <input type="text" placeholder="Write a message or paste a class link..." required style="flex:1;padding:8px 12px;border:1px solid var(--line,#ccc);border-radius:8px;">
        <button type="submit" class="btn primary small">Send</button>
      </form>`;

    const scrollBox = threadEl.querySelector('.chat-scroll');
    scrollBox.scrollTop = scrollBox.scrollHeight;

    threadEl.querySelector('.chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = e.target.querySelector('input');
      const content = input.value.trim();
      if (!content) return;
      input.disabled = true;
      playMessageSound();
      try{
        await apiRequest('/messages/thread/' + otherId, { method:'POST', body: JSON.stringify({ content }) });
        input.value = '';
        await loadThreadInto(otherId, threadEl);
      }catch(err){
        alert(err.message);
      }finally{
        input.disabled = false;
      }
    });
  }

  function wireCard(card){
    const otherId = card.dataset.other;
    const threadEl = card.querySelector('.conv-thread');
    const previewWrap = card.querySelector('.conv-preview-wrap');

    function openThread(){
      if (threadEl.style.display === 'block') return;
      previewWrap.style.display = 'none';
      threadEl.style.display = 'block';
      if (!threadEl.dataset.loaded){
        threadEl.dataset.loaded = '1';
        loadThreadInto(otherId, threadEl);
      }
    }

    card.querySelector('.conv-readmore').addEventListener('click', (e) => { e.stopPropagation(); openThread(); });
    card.querySelector('.conv-top').addEventListener('click', openThread);
    previewWrap.addEventListener('click', openThread);

    return { openThread };
  }

  async function load(){
    const wrap = document.getElementById('msgWrap');
    // "open" carries the OTHER PERSON's user id (see requests.html's
    // "Message X" link), not a trial request id.
    const openId = new URLSearchParams(location.search).get('open');
    try{
      const { conversations } = await fetchConversations();
      let list = conversations;

      // Arrived via a "Message X" link for a person with no messages yet —
      // they won't be in the list above (conversations only include people
      // you've already messaged), so build a placeholder card for them
      // from any trial request you share.
      if (openId && !list.some(c => c.otherId === openId)){
        try{
          const { requests } = await fetchMyTrialRequests();
          const isTutor = user.role === 'TUTOR';
          const match = requests.find(r => (isTutor ? r.student.id : r.tutor.id) === openId);
          if (match){
            const other = isTutor ? match.student : match.tutor;
            list = [{
              otherId: other.id,
              other: { id: other.id, firstName: other.firstName, lastName: other.lastName },
              otherRole: isTutor ? 'STUDENT' : 'TUTOR',
              otherProfile: null,
              lastMessage: null,
              unreadCount: 0,
            }, ...list];
          }
        }catch(err){ /* ignore — the direct-open just won't have a stub card */ }
      }

      wrap.innerHTML = `
        <div class="profile-layout">
          ${sidebarHtml('messages')}
          <div class="profile-card" style="flex:1;min-width:0;">
            <h2 style="margin-top:0;">Messages</h2>
            <div id="convList">
              ${list.length
                ? list.map(conversationCard).join('')
                : '<p style="color:var(--ink-2);">No conversations yet — messages you send or receive will show up here.</p>'}
            </div>
          </div>
        </div>`;
      initSidebarWidgets();

      const handles = {};
      wrap.querySelectorAll('.conv-card').forEach(card => {
        handles[card.dataset.other] = wireCard(card);
        statusOfPreview(card);
      });

      if (openId && handles[openId]){
        handles[openId].openThread();
        const targetCard = wrap.querySelector(`.conv-card[data-other="${openId}"]`);
        if (targetCard) targetCard.scrollIntoView({ behavior:'smooth', block:'start' });
      }
    }catch(err){
      wrap.innerHTML = `<p style="color:var(--rose,#c0392b);">Could not load your messages: ${err.message}</p>`;
    }
  }

  load();
</script>
<style>
  .profile-layout{ display:flex; gap:24px; align-items:flex-start; }
  .profile-sidebar{
    width:180px; flex-shrink:0; display:flex; flex-direction:column; gap:8px;
    border:1px solid var(--line,#eee); border-radius:10px; padding:12px; background:#fff;
  }
  .side-link{
    padding:10px 12px; border-radius:8px; text-decoration:none; color:var(--ink-2,#555);
    font-weight:500; font-size:.92rem;
  }
  .side-link:hover{ background:#f4f4f4; }
  .side-link.active{ background:var(--green,#1e7d43); color:#fff; }
  .profile-card{ border:1px solid var(--line,#eee); border-radius:12px; padding:24px; background:#fff; }
  @media (max-width:720px){ .profile-layout{ flex-direction:column; } .profile-sidebar{ width:100%; flex-direction:row; } }

  #convList{ display:flex; flex-direction:column; gap:14px; margin-top:14px; }

  .conv-card{
    border:1px solid var(--line,#eee); border-radius:12px; padding:14px; background:#fff;
    transition:box-shadow .15s;
  }
  .conv-card:hover{ box-shadow:0 4px 14px rgba(0,0,0,.06); }

  .conv-top{
    display:flex; align-items:flex-start; gap:12px; cursor:pointer; position:relative;
  }
  .conv-who{ flex:1; min-width:0; }
  .conv-name-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .role-chip{
    font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    background:var(--brand-light,#e8f5ec); color:var(--brand-dark,#0b2318);
    padding:2px 8px; border-radius:999px;
  }
  .conv-meta{ font-size:.78rem; color:var(--ink-2,#888); margin-top:2px; }
  .conv-stamp{ font-size:.72rem; color:var(--ink-2,#999); white-space:nowrap; flex-shrink:0; }
  .conv-badge{
    position:absolute; top:-4px; right:-4px;
    background:#c0392b; color:#fff; font-size:.7rem; font-weight:700;
    border-radius:999px; padding:2px 7px; min-width:18px; text-align:center;
  }

  .conv-preview-wrap{ margin-top:8px; cursor:pointer; }
  .conv-preview{
    margin:0; font-size:.88rem; color:var(--ink-2,#555);
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;
  }
  .conv-readmore{
    display:none; font-size:.8rem; font-weight:600; color:var(--brand,#0e7c4a);
    margin-top:4px;
  }

  .conv-thread{ border-top:1px solid var(--line,#eee); margin-top:10px; padding-top:4px; }
</style>
</body>
</html>
