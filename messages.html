<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — International Learning Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="">
<div id="nav"></div>

<section style="padding:40px 0;">
  <div class="container">
    <div id="msgWrap"><p style="color:var(--ink-2);">Loading your messages...</p></div>
  </div>
</section>

<div id="footer"></div>
<script src="app.js"></script>
<script>
  const user = currentUser();
  if (!user){ location.href = 'login.html?next=messages.html'; }
  const isTutor = user.role === 'TUTOR';

  function avatarHtml(name, pictureUrl){
    return pictureUrl
      ? `<img src="${pictureUrl}" class="avatar" style="object-fit:cover;">`
      : `<div class="avatar">${initials(name)}</div>`;
  }

  function fmtStamp(iso){
    try{
      const d = new Date(iso);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
      const isYesterday = d.toDateString() === yesterday.toDateString();
      const time = d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
      if (sameDay) return `Today, ${time}`;
      if (isYesterday) return `Yesterday, ${time}`;
      return `${d.toLocaleDateString(undefined, { month:'short', day:'numeric' })}, ${time}`;
    }catch(e){ return ''; }
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function linkifyMessage(text){
    const escaped = escapeHtml(text);
    return escaped.replace(/(https?:\/\/[^\s<]+)/g, (url) => {
      const trailingPunct = /[.,!?)\]]+$/;
      const trimmed = url.match(trailingPunct) ? url.replace(trailingPunct, '') : url;
      const suffix = url.slice(trimmed.length);
      return `<a href="${trimmed}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:underline;font-weight:600;word-break:break-all;">${trimmed}</a>${suffix}`;
    });
  }

  function quickLaunchBox(){
    return `
      <div class="quick-launch-box">
        <div class="qlb-title">Quick start a class</div>
        <a href="https://zoom.us/start" target="_blank" rel="noopener" class="ql-chip ql-zoom">🎥 Zoom</a>
        <a href="https://meet.google.com/new" target="_blank" rel="noopener" class="ql-chip ql-meet">📅 Google Meet</a>
        <a href="https://teams.microsoft.com/start" target="_blank" rel="noopener" class="ql-chip ql-teams">👥 Teams</a>
        <a href="https://web.skype.com/" target="_blank" rel="noopener" class="ql-chip ql-skype">☎️ Skype</a>
        <a href="https://web.whatsapp.com/" target="_blank" rel="noopener" class="ql-chip ql-whatsapp">💬 WhatsApp</a>
      </div>`;
  }

  function sidebar(active){
    const findLink = isTutor
      ? `<a href="students.html" class="side-link ${active==='find'?'active':''}">Find Students</a>`
      : `<a href="tutors.html" class="side-link ${active==='find'?'active':''}">Find a Tutor</a>`;
    return `
      <a href="dashboard.html" class="side-link">Dashboard</a>
      <a href="profile.html" class="side-link">Profile</a>
      ${findLink}
      <a href="requests.html" class="side-link ${active==='requests'?'active':''}" style="display:flex;align-items:center;justify-content:space-between;">
        <span>Requests</span>
        <span id="requestsBadge" style="display:none;background:#c0392b;color:#fff;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 7px;min-width:18px;text-align:center;"></span>
      </a>
      <a href="messages.html" class="side-link ${active==='messages'?'active':''}" style="display:flex;align-items:center;justify-content:space-between;">
        <span>Messages</span>
        <span id="messagesBadge" style="display:none;background:#c0392b;color:#fff;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 7px;min-width:18px;text-align:center;"></span>
      </a>
      <a href="payments.html" class="side-link">Payments</a>
      <button class="side-link" id="notifBtn" style="border:none;background:none;text-align:left;cursor:pointer;width:100%;font:inherit;color:var(--ink-2,#555);display:flex;align-items:center;gap:6px;" onclick="handleEnableNotifications(this)"><span id="notifBell">🔴</span><span id="notifLabel" style="color:#c0392b;font-weight:600;">Notifications off</span></button>
      <a href="#" class="side-link" onclick="logout();return false;">Log out</a>

      ${quickLaunchBox()}`;
  }

  async function refreshNotifButtonState(){
    const bell = document.getElementById('notifBell');
    const label = document.getElementById('notifLabel');
    if (!bell || !label) return;
    try{
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      const registration = await navigator.serviceWorker.getRegistration();
      const subscription = registration ? await registration.pushManager.getSubscription() : null;
      if (subscription && Notification.permission === 'granted'){
        bell.textContent = '🟢';
        label.textContent = 'Notifications on';
        label.style.color = '#1e7d43';
      }
    }catch(err){ /* ignore — button just stays in its default (off) state */ }
  }

  async function handleEnableNotifications(btn){
    btn.disabled = true;
    const bell = document.getElementById('notifBell');
    const label = document.getElementById('notifLabel');
    try{
      await enablePushNotifications();
      if (bell) bell.textContent = '🟢';
      if (label){ label.textContent = 'Notifications on'; label.style.color = '#1e7d43'; }
    }catch(err){
      alert(err.message);
      btn.disabled = false;
    }
  }

  function refreshRequestsBadge(requests){
    const badge = document.getElementById('requestsBadge');
    if (!badge) return;
    const pendingForMe = requests.filter(r => {
      const iAmReceiver = r.initiatedBy === 'TUTOR' ? !isTutor : isTutor;
      return r.status === 'PENDING' && iAmReceiver;
    }).length;
    if (pendingForMe > 0){
      badge.textContent = pendingForMe;
      badge.style.display = 'inline-block';
    }
  }

  async function refreshMessagesBadgeTotal(totalUnread){
    const badge = document.getElementById('messagesBadge');
    if (!badge) return;
    if (totalUnread > 0){
      badge.textContent = totalUnread;
      badge.style.display = 'inline-block';
    } else {
      badge.style.display = 'none';
    }
  }

  function conversationCard(c){
    const name = (c.other.firstName||'') + ' ' + (c.other.lastName||'');
    const roleLabel = c.otherRole === 'TUTOR' ? 'Tutor' : 'Student';
    const profile = c.otherProfile || {};
    const metaParts = [profile.country, (profile.languages||[]).join(' · ')].filter(Boolean);
    const hasMessage = !!c.lastMessage;

    return `
      <div class="conv-card" data-other="${c.otherId}">
        <div class="conv-top">
          ${avatarHtml(name, profile.pictureUrl)}
          <div class="conv-who">
            ${metaParts.length ? `<div class="conv-meta">${metaParts.join(' · ')}</div>` : ''}
            <div class="conv-name-row">
              <strong>${name}</strong>
              <span class="role-chip">${roleLabel}</span>
            </div>
          </div>
          <div class="conv-stamp">${hasMessage ? fmtStamp(c.lastMessage.createdAt) : ''}</div>
          ${c.unreadCount > 0 ? `<span class="conv-badge">${c.unreadCount}</span>` : ''}
        </div>

        <div class="conv-thread" data-loaded=""></div>
      </div>`;
  }

  async function loadThreadInto(otherId, threadEl){
    threadEl.innerHTML = '<p style="color:var(--ink-2);font-size:.85rem;padding:12px 0;">Loading messages...</p>';
    try{
      const { messages } = await apiRequest('/messages/thread/' + otherId);
      renderThread(otherId, threadEl, messages);
      const card = threadEl.closest('.conv-card');
      const badge = card.querySelector('.conv-badge');
      if (badge) badge.remove();
    }catch(err){
      threadEl.innerHTML = `<p style="color:var(--rose,#c0392b);font-size:.85rem;">${escapeHtml(err.message)}</p>`;
    }
  }

  function renderThread(otherId, threadEl, messages){
    const msgsHtml = messages.length
      ? messages.map(m => {
          const mine = m.senderId === user.id;
          return `<div style="display:flex;justify-content:${mine?'flex-end':'flex-start'};margin-bottom:6px;">
            <div style="max-width:78%;padding:8px 12px;border-radius:12px;background:${mine?'var(--green,#1e7d43)':'#f0f0f0'};color:${mine?'#fff':'#222'};font-size:.88rem;white-space:pre-wrap;">
              ${linkifyMessage(m.content)}
            </div>
          </div>`;
        }).join('')
      : '<p style="color:var(--ink-2);font-size:.85rem;">No messages yet — say hello.</p>';

    threadEl.innerHTML = `
      <div class="chat-scroll">
        ${msgsHtml}
      </div>
      <p style="font-size:.75rem;color:var(--ink-2);margin:0 0 8px;">Tip: paste a Zoom, Google Meet, Skype or WhatsApp link here when you're ready for class — it becomes tappable automatically.</p>
      <form class="chat-form" style="display:flex;gap:8px;">
        <input type="text" placeholder="Write a message or paste a class link..." required style="flex:1;padding:8px 12px;border:1px solid var(--line,#ccc);border-radius:8px;">
        <button type="submit" class="btn primary small">Send</button>
      </form>`;

    const scrollBox = threadEl.querySelector('.chat-scroll');
    scrollBox.scrollTop = scrollBox.scrollHeight;

    threadEl.querySelector('.chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = e.target.querySelector('input');
      const content = input.value.trim();
      if (!content) return;
      input.disabled = true;
      playMessageSound();
      try{
        await apiRequest('/messages/thread/' + otherId, { method:'POST', body: JSON.stringify({ content }) });
        input.value = '';
        await loadThreadInto(otherId, threadEl);
      }catch(err){
        alert(err.message);
      }finally{
        input.disabled = false;
      }
    });
  }

  async function load(){
    const wrap = document.getElementById('msgWrap');
    const openId = new URLSearchParams(location.search).get('open');
    try{
      const [{ conversations }, { requests }] = await Promise.all([
        fetchConversations(),
        fetchMyTrialRequests(),
      ]);
      let list = conversations;

      if (openId && !list.some(c => c.otherId === openId)){
        const match = requests.find(r => (isTutor ? r.student.id : r.tutor.id) === openId);
        if (match){
          const other = isTutor ? match.student : match.tutor;
          list = [{
            otherId: other.id,
            other: { id: other.id, firstName: other.firstName, lastName: other.lastName },
            otherRole: isTutor ? 'STUDENT' : 'TUTOR',
            otherProfile: null,
            lastMessage: null,
            unreadCount: 0,
          }, ...list];
        }
      }

      const totalUnread = conversations.reduce((sum, c) => sum + (c.unreadCount || 0), 0);

      wrap.innerHTML = `
        <div class="profile-layout">
          <aside class="profile-sidebar">
            ${sidebar('messages')}
          </aside>
          <div class="profile-card" style="flex:1;min-width:0;">
            <h2 style="margin-top:0;">Messages</h2>
            <div id="convList">
              ${list.length
                ? list.map(conversationCard).join('')
                : '<p style="color:var(--ink-2);">No conversations yet — messages you send or receive will show up here.</p>'}
            </div>
          </div>
        </div>`;

      refreshNotifButtonState();
      refreshRequestsBadge(requests);
      refreshMessagesBadgeTotal(totalUnread);

      const cards = wrap.querySelectorAll('.conv-card');
      for (const card of cards){
        const otherId = card.dataset.other;
        const threadEl = card.querySelector('.conv-thread');
        await loadThreadInto(otherId, threadEl);
      }

      if (openId){
        const targetCard = wrap.querySelector(`.conv-card[data-other="${openId}"]`);
        if (targetCard) targetCard.scrollIntoView({ behavior:'smooth', block:'start' });
      }
    }catch(err){
      wrap.innerHTML = `<p style="color:var(--rose,#c0392b);">Could not load your messages: ${err.message}</p>`;
    }
  }

  load();
</script>
<style>
  .profile-layout{ display:flex; gap:24px; align-items:flex-start; }
  .profile-sidebar{
    width:180px; flex-shrink:0; display:flex; flex-direction:column; gap:8px;
    border:1px solid var(--line,#eee); border-radius:10px; padding:12px; background:#fff;
  }
  .side-link{
    padding:10px 12px; border-radius:8px; text-decoration:none; color:var(--ink-2,#555);
    font-weight:500; font-size:.92rem;
  }
  .side-link:hover{ background:#f4f4f4; }
  .side-link.active{ background:var(--green,#1e7d43); color:#fff; }
  .profile-card{ border:1px solid var(--line,#eee); border-radius:12px; padding:24px; background:#fff; }
  @media (max-width:720px){ .profile-layout{ flex-direction:column; } .profile-sidebar{ width:100%; flex-direction:row; flex-wrap:wrap; } }

  .quick-launch-box{ margin-top:8px; padding-top:10px; border-top:1px solid var(--line,#eee); display:flex; flex-direction:column; gap:6px; width:100%; }
  .qlb-title{ font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-2,#888); margin-bottom:2px; }
  .ql-chip{ display:flex; align-items:center; gap:6px; padding:8px 10px; border-radius:8px; color:#fff; font-size:.82rem; font-weight:600; text-decoration:none; }
  .ql-zoom{ background:#2D8CFF; }
  .ql-meet{ background:#00897B; }
  .ql-teams{ background:#5059C9; }
  .ql-skype{ background:#00AFF0; }
  .ql-whatsapp{ background:#25D366; }

  #convList{ display:flex; flex-direction:column; gap:18px; margin-top:14px; }

  .conv-card{
    border:1px solid var(--line,#eee); border-radius:12px; padding:14px; background:#fff;
  }

  .conv-top{
    display:flex; align-items:flex-start; gap:12px; position:relative;
    padding-bottom:10px; border-bottom:1px solid var(--line,#eee); margin-bottom:8px;
  }
  .conv-who{ flex:1; min-width:0; }
  .conv-meta{ font-size:.72rem; color:var(--ink-2,#888); }
  .conv-name-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:2px; }
  .role-chip{
    font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    background:var(--brand-light,#e8f5ec); color:var(--brand-dark,#0b2318);
    padding:2px 8px; border-radius:999px;
  }
  .conv-stamp{ font-size:.72rem; color:var(--ink-2,#999); white-space:nowrap; flex-shrink:0; }
  .conv-badge{
    position:absolute; top:-4px; right:-4px;
    background:#c0392b; color:#fff; font-size:.7rem; font-weight:700;
    border-radius:999px; padding:2px 7px; min-width:18px; text-align:center;
  }

  .chat-scroll{
    max-height:320px; overflow-y:auto; padding:10px;
    border:1px solid var(--line,#eee); border-radius:8px; margin:0 0 10px;
  }
</style>
</body>
</html>
