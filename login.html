<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — International Learning Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="">
<div id="nav"></div>

<section style="padding:56px 0;">
  <div class="container">
    <div class="form-shell">
      <h2>Welcome back</h2>
      <p class="form-sub">Log in to book classes or manage your tutor profile.</p>
      <div id="loginMsg" class="msg"></div>
      <form id="loginForm">
        <div class="field"><label>Email</label><input type="email" id="email" required></div>
        <div class="field"><label>Password</label><input type="password" id="password" required></div>
        <button type="submit" class="btn primary block">Log in</button>
      </form>
      <p class="form-foot">Don't have an account? <a href="register.html">Register free</a></p>
    </div>
  </div>
</section>

<div id="footer"></div>
<script src="app.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const msg = document.getElementById('loginMsg');
    msg.style.display = 'none';
    const submitBtn = e.target.querySelector('button[type=submit]');
    submitBtn.disabled = true;
    try{
      await loginUser({
        email: document.getElementById('email').value.trim().toLowerCase(),
        password: document.getElementById('password').value,
      });
      const next = new URLSearchParams(location.search).get('next') || 'profile.html';
      // Don't just go to `next` blindly — if the profile isn't complete
      // yet, send them to profile-setup.html first (it will forward them
      // to `next` once they finish, via ?next=).
      try{
        const profile = await getMyProfile();
        location.href = profile ? next : ('profile-setup.html?next=' + encodeURIComponent(next));
      }catch(profileErr){
        location.href = 'profile-setup.html?next=' + encodeURIComponent(next);
      }
    }catch(err){
      msg.className='msg error'; msg.textContent = err.message; msg.style.display='block';
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
